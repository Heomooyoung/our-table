<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리테이블</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7F7F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F0F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리테이블">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="icon" href="assets/icon-192.png">
<style>
/* ── 디자인 토큰: 종이 노트 × 법랑 그린. 밤에는 '밤의 주방' ── */
:root{
  --paper:#F7F7F7; --card:#FFFFFF; --ink:#121111; --sub:#787676;
  --line:#E6E6E6; --line2:#F2F2F2;
  --acc:#2C5B45; --acc-bg:#2C5B45; --acc-ink:#FFFFFF; --soft:#ECF1EE;
  --dark:#121111; --dark-ink:#FFFFFF;
  --heart:#C2492F; --heart-soft:#F6E7E1; --star:#F5C518;
  --r:16px; --rp:999px;
  --sh:0 1px 2px rgba(18,17,17,.04),0 8px 24px rgba(18,17,17,.06);
  --kr:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --paper:#0F0F0F; --card:#1A1A1A; --ink:#F2F2F2; --sub:#A3A1A2;
    --line:#2B2B2B; --line2:#232323;
    --acc:#7FB79A; --acc-bg:#2F6349; --acc-ink:#F4F9F6; --soft:#1E2A23;
    --dark:#F2F2F2; --dark-ink:#121111;
    --heart:#E36F4F; --heart-soft:#33231C;
    --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme=dark]{
  --paper:#0F0F0F; --card:#1A1A1A; --ink:#F2F2F2; --sub:#A3A1A2;
  --line:#2B2B2B; --line2:#232323;
  --acc:#7FB79A; --acc-bg:#2F6349; --acc-ink:#F4F9F6; --soft:#1E2A23;
  --dark:#F2F2F2; --dark-ink:#121111;
  --heart:#E36F4F; --heart-soft:#33231C;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--kr);letter-spacing:-.024em;
  -webkit-font-smoothing:antialiased;min-height:100dvh}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}

#app{max-width:520px;margin:0 auto;padding:0 18px calc(112px + env(safe-area-inset-bottom))}

/* ── 헤더 ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 2px 8px}
.hdr .wm{display:flex;flex-direction:column;gap:2px}
.hdr .wm b{font-size:21px;font-weight:800;letter-spacing:-.035em}
.hdr .wm span{font-size:12.5px;color:var(--sub);font-weight:500}
.icobtn{width:34px;height:34px;border-radius:var(--rp);display:grid;place-items:center;color:var(--ink)}
.icobtn:active{background:var(--line2)}
.avatar{width:42px;height:42px;border-radius:var(--rp);background:var(--dark);color:var(--dark-ink);
  display:grid;place-items:center;font-size:15px;font-weight:800;letter-spacing:-.02em;flex:none}

/* ── 섹션 공통 ── */
.eyebrow{font:700 10px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--acc)}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec-h h2{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-top:3px;text-wrap:balance}
.sec-h .cnt{font:600 11px var(--mono);color:var(--sub)}

/* ── 홈 히어로 ── */
.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);
  padding:20px 18px 18px;margin-top:14px;position:relative;overflow:hidden}
.hero .date{font:600 10px var(--mono);letter-spacing:.24em;color:var(--sub);text-transform:uppercase}
.hero h1{font-size:29px;line-height:1.25;font-weight:900;letter-spacing:-.055em;margin:8px 0 2px;text-wrap:balance}
.hero .sub{color:var(--sub);font-size:13.5px}
.hero .acts{display:flex;gap:8px;margin-top:12px}
.hero-menu{display:flex;gap:14px;align-items:center;margin:14px 0 4px}
.hero-menu .ph,.hero-menu .mono-ph{width:86px;height:86px;border-radius:12px;flex:none}
.hero-menu .nm{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.3;text-wrap:balance}
.hero-menu .mt{font:600 11px var(--mono);color:var(--sub);margin-top:4px}

/* ── 오늘의 끼니 카드 ── */
.meals{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.meals.gap{margin-top:16px}
.mealc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-radius:15px;padding:11px 13px;min-height:62px}
.mealc.blank{border-style:dashed;background:none}
.mealc .ph,.mealc .mono-ph{width:42px;height:42px;flex:none;border-radius:11px}
.mealc .mono-ph b{font-size:17px}
.mealc .mdel{flex:none;width:42px;height:42px;border-radius:11px;background:var(--line2);
  display:grid;place-items:center;font-size:20px}
.mealc .mbody{flex:1;min-width:0}
.mealc .mlab{display:block;font:700 10px var(--mono);letter-spacing:.18em;color:var(--sub)}
.mealc.blank .mlab{flex:none;width:auto;letter-spacing:.1em}
.mealc .mval{display:block;font-size:16px;font-weight:800;letter-spacing:-.035em;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mealc .mval.none{flex:1;font-size:14px;font-weight:600;color:var(--sub);margin:0}
.mealc .mgo{flex:none;width:32px;height:32px;border-radius:99px;display:grid;place-items:center;
  color:var(--sub);background:var(--line2)}
/* ── 주간 리스트 ── */
.wlist{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.wrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;
  border-bottom:1px solid var(--line2)}
.wrow:last-child{border-bottom:0}
.wrow.today{background:var(--soft)}
.wrow .wd{flex:none;width:18px;font-size:13.5px;font-weight:800;color:var(--sub)}
.wrow.today .wd{color:var(--acc)}
.wrow .wn{flex:none;width:22px;font:700 13px var(--mono);color:var(--sub);font-variant-numeric:tabular-nums}
.wrow .wtx{flex:1;min-width:0}
.wrow .wm{display:block;font-size:15px;font-weight:700;letter-spacing:-.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .wm.none{color:var(--sub);font-weight:500;font-size:13.5px}
.wrow .wsub{display:block;font-size:11.5px;color:var(--sub);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .wc{flex:none;font:700 9.5px var(--mono);color:var(--sub);background:var(--line2);border-radius:99px;padding:3px 7px}
/* ── 오늘의 메뉴 크게 ── */
.bigm{margin-top:14px}
.bigph{position:relative;display:block;width:100%;height:190px;border-radius:18px;background-size:cover;
  background-position:center;background-color:var(--line2);overflow:hidden}
.bigph.noimg{display:grid;place-items:center}
.bigmono{font-size:64px;font-weight:900;color:var(--sub);opacity:.5;letter-spacing:-.05em}
.bigrk{position:absolute;top:10px;left:10px;background:var(--acc-bg);color:var(--acc-ink);
  font:800 10px var(--mono);letter-spacing:.08em;padding:5px 10px;border-radius:99px}
.bignth{position:absolute;bottom:10px;right:10px;background:rgba(18,17,17,.55);color:#fff;
  font:700 10px var(--mono);letter-spacing:.04em;padding:5px 9px;border-radius:99px;backdrop-filter:blur(4px)}
.bigt{font-size:24px;font-weight:900;letter-spacing:-.045em;margin-top:12px;text-wrap:balance}
.bigst{margin-top:6px}
.bigacts{display:flex;gap:8px;margin-top:14px}
.mdel2{display:grid;place-items:center;font-size:52px}
.wrow .wt{flex:none;font:700 9.5px var(--mono);letter-spacing:.1em;color:var(--acc-ink);
  background:var(--acc-bg);border-radius:99px;padding:3px 8px}

/* ── 가로 레일 (베스트) ── */
.rail{display:flex;gap:10px;overflow-x:auto;padding:2px 18px 8px;margin:0 -18px;scroll-snap-type:x proximity;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rcard{flex:0 0 146px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;text-align:left;position:relative}
.rcard .ph,.rcard .mono-ph{height:112px;border-radius:0}
.rcard .b{padding:9px 10px 11px}
.rcard .nm{font-size:13px;font-weight:700;letter-spacing:-.02em;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .rk{position:absolute;top:8px;left:8px;background:var(--dark);color:var(--dark-ink);
  font:700 9px var(--mono);letter-spacing:.1em;padding:4px 8px;border-radius:99px}
.rcard .rk.r1{background:var(--acc-bg);color:var(--acc-ink)}

/* ── 사진 · 모노그램 ── */
.ph{background-size:cover;background-position:center;border-radius:14px}
.mono-ph{border-radius:14px;display:grid;place-items:center;position:relative;color:var(--sub);
  background:var(--line2)}
.mono-ph b{font-size:30px;font-weight:900;letter-spacing:-.04em}
.mono-ph i{position:absolute;bottom:6px;right:8px;font:600 8px var(--mono);letter-spacing:.14em;font-style:normal;opacity:.55}

/* ── 메뉴판 ── */
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.srchrow{display:flex;gap:9px}
.fbtn{flex:none;width:48px;height:48px;border-radius:15px;background:var(--dark);color:var(--dark-ink);
  display:grid;place-items:center}
.fbtn.on{background:var(--acc-bg);color:var(--acc-ink)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:0 14px;height:48px}
.search input{min-width:0}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px}
.search input::placeholder{color:var(--sub);font-family:var(--mono);font-size:12px;letter-spacing:.08em}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 18px 2px;margin:0 -18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12.5px;font-weight:600;color:var(--ink);border:1px solid var(--line);
  background:var(--card);border-radius:999px;padding:9px 15px;letter-spacing:-.015em}
.chip.on{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;
  text-align:left;box-shadow:var(--sh);position:relative;display:flex;flex-direction:column}
.mcard .ph,.mcard .mono-ph{height:118px;border-radius:0}
.mcard .b{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.mcard .nm{font-size:14.5px;font-weight:800;letter-spacing:-.025em;line-height:1.35;text-wrap:balance}
.mcard .mt{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.mcard .no{position:absolute;top:8px;right:9px;font:600 9px var(--mono);letter-spacing:.12em;
  color:#fff;background:rgba(20,26,20,.42);padding:3px 6px;border-radius:5px;backdrop-filter:blur(4px)}
.mcard .mono-ph~.b~.no, .no.dim{color:var(--sub);background:none;backdrop-filter:none}
.cooked{font:600 10.5px var(--mono);color:var(--sub);letter-spacing:.04em}

/* ── 하트 ── */
.hearts{display:inline-flex;gap:2.5px}
.hearts svg{width:14px;height:14px;fill:var(--line);transition:fill .15s,transform .15s}
.hearts svg.on{fill:var(--star)}
.hearts.big svg{width:26px;height:26px}
.hearts.tap svg:active{transform:scale(1.25)}

/* ── 식단표 ── */
.wknav{display:flex;align-items:center;justify-content:space-between;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:14px}
.wknav .wtit{text-align:center}
.wknav .wtit b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.wknav .wtit div{font:600 10px var(--mono);color:var(--sub);letter-spacing:.1em;margin-top:1px}
.wknav .icobtn{width:34px;height:34px}
.day{display:flex;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line2)}
.day:last-child{border-bottom:0}
.day .dt{width:40px;flex:none;text-align:center;padding-top:2px}
.day .dt .w{font:700 9.5px var(--mono);letter-spacing:.18em;color:var(--sub)}
.day .dt .n{font:700 19px var(--mono);letter-spacing:-.04em;margin-top:1px;font-variant-numeric:tabular-nums}
.day.today .dt .n{color:var(--acc)}
.day.today .dt .w{color:var(--acc)}
.slots{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.slot{display:flex;align-items:center;gap:7px;border:1px dashed var(--line);border-radius:11px;
  padding:8px 9px;min-height:40px;text-align:left;width:100%;min-width:0;flex:1}
.slot.pick{border-style:solid;border-color:var(--acc-bg);background:var(--soft)}
.slot.pick .snm{color:var(--acc);font-weight:700}
.slot .ml{font:700 9px var(--mono);letter-spacing:.14em;color:var(--sub);flex:none}
.slot .snm{flex:1;min-width:0;font-size:13px;font-weight:600;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
.slot.fill{border-style:solid;background:var(--card);border-color:var(--line)}
.slot.fill .snm{color:var(--ink)}
.slot .sx{flex:none;width:22px;height:22px;display:grid;place-items:center;color:var(--sub);border-radius:7px}
.slot .sx:active{background:var(--line2)}

/* ── 장보기 ── */
.prog{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:13px}
.prog .pt{display:flex;justify-content:space-between;align-items:baseline}
.prog .pt b{font-size:14px;font-weight:800;letter-spacing:-.02em}
.prog .pt span{font:600 11px var(--mono);color:var(--sub);font-variant-numeric:tabular-nums}
.pbar{height:5px;background:var(--line2);border-radius:99px;margin-top:9px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--acc-bg);border-radius:99px;transition:width .3s ease}
.sitem{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.sitem:last-child{border-bottom:0}
.cbox{flex:none;width:24px;height:24px;border:1.5px solid var(--line);border-radius:var(--rp);
  display:grid;place-items:center;color:transparent;transition:all .15s}
.sitem.done .cbox{background:var(--acc-bg);border-color:var(--acc-bg);color:var(--acc-ink)}
.sitem .sb{flex:1;min-width:0}
.sitem .snm2{font-size:14.5px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sdiv{font:700 10.5px var(--mono);letter-spacing:.14em;color:var(--sub);padding:14px 2px 8px;
  border-top:1px solid var(--line);margin-top:6px}
.sitem.done{opacity:.42}
.sitem.done .snm2{text-decoration:line-through;text-decoration-color:var(--sub)}
.sitem .src{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.5}
.sitem .thumb{flex:none;width:52px;height:52px;border-radius:14px;background-size:cover;background-position:center;
  border:1px solid var(--line)}
.need{display:inline-block;font:800 11.5px var(--mono);color:var(--acc);background:var(--soft);
  border-radius:99px;padding:2px 8px;letter-spacing:.02em}
.brand{display:inline-block;font:600 9.5px var(--mono);letter-spacing:.06em;color:var(--acc);
  border:1px solid var(--acc);border-radius:5px;padding:1px 5px;opacity:.85}
.buy{font:600 10.5px var(--mono);color:var(--acc);letter-spacing:.02em;
  border-bottom:1px dotted var(--acc);margin-right:12px;cursor:pointer}
/* ── 제품 검색 ── */
.prod{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 2px;border-bottom:1px solid var(--line2)}
.prod .pimg{flex:none;width:52px;height:52px;border-radius:9px;background-size:cover;background-position:center;
  border:1px solid var(--line);background-color:var(--line2)}
.prod .pinfo{flex:1;min-width:0}
.prod .pn{font-size:13.5px;font-weight:600;letter-spacing:-.02em;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .pp{font:700 12.5px var(--mono);color:var(--acc);margin-top:3px}
.rk{display:inline-block;font:700 8.5px var(--mono);letter-spacing:.06em;color:#fff;background:#3B7BD9;
  border-radius:4px;padding:1px 4px;margin-left:5px;vertical-align:1px}
.disc{font-size:10.5px;color:var(--sub);line-height:1.5;margin-top:12px}
/* ── 설정 (그룹 리스트) ── */
.shead{display:flex;align-items:center;justify-content:center;position:relative;padding:6px 0 18px}
.shead b{font-size:16px;font-weight:800}
.shead .x{position:absolute;left:0;color:var(--ink)}
.sgrp{font-size:12px;font-weight:600;color:var(--sub);margin:22px 0 8px 2px}
.slist{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.srow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:0 16px;min-height:52px;
  border-bottom:1px solid var(--line2);background:none}
.slist .srow:last-child{border-bottom:0}
.srow:active{background:var(--line2)}
.srow .sl{flex:1;min-width:0;font-size:14.5px;font-weight:600}
.srow .sv{font-size:13.5px;color:var(--sub);flex:none;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .chev{flex:none;color:var(--line);display:grid;place-items:center}
.srow.warn .sl{color:var(--heart)}
.ok{font:700 10.5px var(--mono);color:var(--acc);border:1px solid var(--acc);border-radius:99px;padding:2px 8px;flex:none}
.xadd{display:flex;gap:7px;margin-top:14px}
.xadd input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;height:46px;padding:0 12px;outline:none;font-size:16px}
.ifield{flex:1;min-width:0;position:relative;display:flex}
.ifield input{width:100%;padding-right:44px}
.ifind{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:10px;
  display:grid;place-items:center;color:var(--acc);background:var(--soft)}
.ifind:active{filter:brightness(.95)}
.xadd input:focus{border-color:var(--acc)}
.xadd input.amt{flex:0 0 88px}

/* ── 리스트 공용 카드 ── */
.paper{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:4px 16px}

/* ── 버튼 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:52px;padding:0 22px;
  border-radius:var(--rp);font-size:15px;font-weight:700;letter-spacing:-.015em}
.btn.pri{background:var(--acc-bg);color:var(--acc-ink)}
.btn.pri:active{filter:brightness(1.1)}
.btn.gho{border:1.5px solid var(--line);color:var(--ink);background:var(--card)}
.btn.gho:active{background:var(--line2)}
.btn.dk{background:var(--dark);color:var(--dark-ink)}
.btn.dk:active{opacity:.85}
.btn.blk{width:100%}
.btn.warn{color:var(--heart)}
.tbtns{display:flex;justify-content:center;gap:22px;margin-top:6px}
.tbtn{font-size:13px;font-weight:600;color:var(--sub);padding:8px 4px}
.tbtn.warn{color:var(--heart)}

/* ── 탭바 + FAB ── */
/* 떠 있는 알약 탭바 */
.tabbar{position:fixed;left:0;right:0;z-index:40;display:flex;justify-content:center;pointer-events:none;
  bottom:calc(16px + env(safe-area-inset-bottom))}
.tabin{pointer-events:auto;display:grid;grid-template-columns:repeat(5,54px);align-items:center;height:64px;
  background:var(--dark);border-radius:var(--rp);padding:0 6px;box-shadow:0 8px 28px rgba(18,17,17,.28)}
.tb{position:relative;display:grid;place-items:center;height:48px;border-radius:var(--rp);color:var(--dark-ink);opacity:.5}
.tb svg{width:23px;height:23px}
.tb span{position:absolute;bottom:2px;font-size:0}
.tb.act{opacity:1}
.tb.act::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:99px;background:var(--acc)}
.fabwrap{display:grid;place-items:center}
.fab{width:46px;height:46px;border-radius:var(--rp);background:var(--acc-bg);color:var(--acc-ink);
  display:grid;place-items:center;box-shadow:0 4px 14px rgba(44,91,69,.45)}
.fab:active{transform:scale(.92)}
.fab svg{width:23px;height:23px}

/* ── 시트 ── */
.sw{position:fixed;inset:0;z-index:60}
.sw>.sb{position:absolute;inset:0;background:rgba(14,20,14,.58);opacity:0;transition:opacity .24s}
.sw .sp{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--paper);
  border-radius:20px 20px 0 0;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:0 18px calc(26px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);box-shadow:0 -14px 44px rgba(14,22,14,.30);
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,.3,1)}
.grabzone{position:sticky;top:0;z-index:5;background:var(--paper);padding:11px 0 5px;margin:0 -18px;
  touch-action:none;cursor:grab}
.sw.on>.sb{opacity:1}
.sw.on .sp{transform:translateY(0)}
.sw.closing>.sb{opacity:0}
.sw.closing .sp{transform:translateY(100%)}
.grab{width:46px;height:5px;border-radius:99px;background:var(--line);margin:0 auto}

/* ── 상세 ── */
.dhero{position:relative;margin:2px 0 18px}
.dhero .ph,.dhero .mono-ph{height:280px;border-radius:22px}
.dhero .mono-ph b{font-size:64px}
.dhero .no{position:absolute;bottom:12px;left:14px;font:600 10px var(--mono);letter-spacing:.14em;
  color:#fff;background:rgba(18,17,17,.5);padding:5px 9px;border-radius:99px;backdrop-filter:blur(4px)}
.dhero .mono-ph+.no{color:var(--sub);background:none;backdrop-filter:none}
.dhero .mono-ph i{display:none}
.fbtn-r{position:absolute;top:12px;width:42px;height:42px;border-radius:var(--rp);background:var(--card);
  color:var(--ink);display:grid;place-items:center;box-shadow:0 3px 10px rgba(18,17,17,.16)}
.fbtn-r.l{left:12px} .fbtn-r.r{right:12px;color:var(--heart)}
.dtit{display:flex;flex-direction:column;gap:7px}
.dtit h3{font-size:23px;font-weight:900;letter-spacing:-.04em;line-height:1.3;text-wrap:balance}
.dmeta{font:600 11px var(--mono);color:var(--sub);letter-spacing:.05em}
.ing{display:flex;align-items:center;gap:10px;padding:10.5px 0;border-bottom:1px dashed var(--line2)}
.ing:last-child{border-bottom:0}
.ing .thumb{flex:none;width:34px;height:34px;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--line)}
.ing .leader{flex:1;display:flex;align-items:baseline;gap:8px;min-width:0}
.ing .inm{font-size:14px;font-weight:600;letter-spacing:-.02em;flex:none;max-width:60%}
.ing .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:16px}
.ing .amt{font:600 12px var(--mono);color:var(--sub);flex:none;font-variant-numeric:tabular-nums}
.steps{counter-reset:st;display:flex;flex-direction:column;gap:12px}
.steps li{list-style:none;display:flex;gap:12px;align-items:flex-start}
.steps li::before{counter-increment:st;content:counter(st,decimal-leading-zero);
  font:700 11px var(--mono);color:var(--acc);letter-spacing:.06em;padding-top:3px;flex:none}
.note{background:var(--soft);border-radius:11px;padding:12px 14px;font-size:13.5px;color:var(--ink);white-space:pre-line}
.dacts{display:flex;flex-direction:column;gap:8px;margin-top:20px}

/* ── 폼 ── */
.fld{margin-top:18px}
.ftop{display:flex;gap:11px;align-items:center;margin-top:6px}
.fthumb{flex:none;width:64px;height:64px;border-radius:16px;border:1.5px dashed var(--line);
  display:grid;place-items:center;color:var(--sub);background-size:cover;background-position:center}
.fthumb.has{border-style:solid;border-color:var(--line)}
.fname{flex:1;min-width:0;height:64px;font-size:19px;font-weight:800;letter-spacing:-.035em}
.frate{display:flex;align-items:center;gap:12px;margin-top:16px}
.frate .frl{font-size:12.5px;font-weight:600;color:var(--sub)}
.strow{display:flex;align-items:flex-start;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:11px 12px;margin-bottom:7px}
.strow b{font:700 11px var(--mono);color:var(--acc);flex:none;padding-top:2px}
.strow .stx{flex:1;min-width:0;font-size:14px;line-height:1.5;word-break:break-word}
#qstep{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;outline:none;font-size:16px;resize:none;line-height:1.45;max-height:150px;overflow-y:auto}
#qstep:focus{border-color:var(--acc)}
#f-memo{resize:none;overflow-y:auto;max-height:180px}
.fld>label{display:block;font-size:12.5px;font-weight:600;letter-spacing:-.02em;color:var(--sub);margin-bottom:8px}
.in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;height:46px;
  padding:0 13px;outline:none;font-size:16px;transition:border-color .15s}
.in:focus{border-color:var(--acc)}
textarea.in{height:auto;min-height:58px;padding:11px 13px;resize:vertical;line-height:1.55}
.in::placeholder{color:var(--sub);opacity:.7}
#f-name{height:52px;font-size:17px;font-weight:700}
.fphoto{width:100%;height:86px;border:1.5px dashed var(--line);border-radius:13px;display:flex;
  align-items:center;justify-content:center;gap:8px;color:var(--sub);font-size:13px;font-weight:600;
  background-size:cover;background-position:center}
.fphoto.has{border-style:solid;color:transparent}
.irow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:9px 10px;margin-bottom:7px}
.irow .ithumb{flex:none;width:38px;height:38px;border-radius:10px;background-size:cover;background-position:center;border:1px solid var(--line)}
.irow .idot{flex:none;width:6px;height:6px;border-radius:99px;background:var(--line);margin:0 16px}
.irow .ibody{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;background:none}
.irow .itxt{flex:1;min-width:0}
.irow .ibr.sub{color:var(--sub);font-weight:500}
.qpill{flex:none;display:flex;align-items:center;height:38px;background:var(--line2);
  border:1px solid transparent;border-radius:11px;overflow:hidden;transition:border-color .15s}
.qpill:focus-within{border-color:var(--acc);background:var(--card)}
.qpill .iqn{width:44px;height:100%;border:0;background:none;text-align:right;font-size:15px;font-weight:800;
  outline:none;padding:0 2px 0 8px;color:var(--ink);letter-spacing:-.02em}
.qpill .iqn::placeholder{font-weight:600;color:var(--sub);opacity:.6}
.qpill .iu{height:100%;border:0;background:none;outline:none;font-size:13.5px;font-weight:600;color:var(--sub);
  -webkit-appearance:none;appearance:none;padding:0 20px 0 4px;max-width:78px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23787676' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 4px center;background-size:13px}
.qpill:focus-within .iu{color:var(--ink)}
.irow .inm2{display:block;font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .iamt{font-weight:500;color:var(--sub);margin-left:7px;font-size:13px}
.irow .ibr{display:block;font-size:11.5px;color:var(--acc);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ir1{display:flex;gap:7px}
.ir1 .in{border:0;background:var(--line2);height:42px;font-size:16px}
.ir1 .i-n{flex:1;min-width:0}
.ir1 .i-a{flex:0 0 96px}
.ir2{display:flex;gap:7px;margin-top:7px;align-items:center}
.ir2 .i-b{flex:1;min-width:0;border:0;background:var(--line2);height:38px;font-size:16px}
.pbtn{flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);display:grid;
  place-items:center;color:var(--sub);background-size:cover;background-position:center}
.pbtn.has{color:transparent;border-color:var(--acc)}
.xbtn{flex:none;width:32px;height:36px;display:grid;place-items:center;color:var(--sub)}
.addrow{width:100%;border:1.5px dashed var(--line);border-radius:12px;height:44px;color:var(--sub);
  font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.fcats{display:flex;gap:6px;flex-wrap:wrap}

/* ── 뽑기 · 사다리 ── */
.game{min-height:420px;display:flex;flex-direction:column}
.mchips{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.gacts{display:flex;gap:8px;margin-top:18px}
.gacts .btn{flex:1}
.lsvg{width:100%;height:auto;margin-top:4px}
.lsvg .rail{stroke:var(--sub);opacity:.5;stroke-width:3;stroke-linecap:round}
.lsvg .rung{stroke:var(--sub);opacity:.5;stroke-width:3;stroke-linecap:round}
.lsvg .trail{stroke:var(--acc);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lsvg .snode circle{fill:var(--card);stroke:var(--line);stroke-width:2}
.lsvg .snode text{fill:var(--ink);font:700 13px var(--mono)}
.lsvg .snode.hot circle{fill:var(--acc-bg);stroke:var(--acc-bg)}
.lsvg .snode.hot text{fill:var(--acc-ink)}
.lsvg .cand{fill:var(--sub);font:600 11px var(--kr)}
.lsvg .cand.win{fill:var(--acc);font-weight:800}
.ghint{text-align:center;color:var(--sub);font-size:12.5px;margin-top:10px}

/* ── 픽커 ── */
.prow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 2px;border-bottom:1px solid var(--line2)}
.prow .ph,.prow .mono-ph{width:44px;height:44px;flex:none}
.prow .mono-ph b{font-size:18px}
.prow .pb{flex:1;min-width:0}
.prow .pnm{font-size:14.5px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 메뉴 리스트 ── */
.lrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--sh);padding:10px 12px;margin-bottom:10px}
.lmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.lmain .ph,.lmain .mono-ph{width:58px;height:58px;flex:none;border-radius:14px}
.lmain .mono-ph b{font-size:20px}
.lb{flex:1;min-width:0;display:block}
.lnm{display:block;font-size:15px;font-weight:800;letter-spacing:-.025em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmt{display:flex;align-items:center;gap:8px;margin-top:3px}
.ladd{flex:none;width:40px;height:40px;border-radius:var(--rp);background:var(--dark);color:var(--dark-ink);display:grid;place-items:center}
.ladd:active{filter:brightness(.95)}
.lmain .mono-ph i,.prow .mono-ph i,.vopt .mono-ph i{display:none}
.hero .acts .btn{flex:1;padding:0 8px}

/* ── 가족 투표 ── */
.vopt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:8px}
.vopt.on{border-color:var(--acc);background:var(--soft)}
.vopt{transition:background .08s ease,border-color .08s ease,transform .08s ease}
.vopt:active{transform:scale(.985);background:var(--line2)}
.vopt .vck{flex:none;width:24px;height:24px;border-radius:99px;border:1.5px solid var(--line);
  display:grid;place-items:center;color:transparent}
.vopt.on .vck{background:var(--acc-bg);border-color:var(--acc-bg);color:var(--acc-ink)}
.vcta{position:sticky;bottom:0;margin:6px -18px 0;padding:12px 18px calc(6px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--paper) 75%,transparent);display:flex;flex-direction:column;gap:8px}
.vopt .ph,.vopt .mono-ph{width:44px;height:44px;flex:none}
.vopt .mono-ph b{font-size:18px}
.vopt .vnm{flex:1;min-width:0;font-size:14.5px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vturn{text-align:center;padding:26px 0 12px}
.vturn .vt1{font:700 10px var(--mono);letter-spacing:.24em;color:var(--acc);text-transform:uppercase}
.vturn .vt2{font-size:26px;font-weight:900;letter-spacing:-.04em;margin-top:8px;text-wrap:balance}
.vturn .vt3{color:var(--sub);font-size:13px;margin-top:8px;line-height:1.6}
.vbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.vbar .vn{flex:none;width:88px;font-size:13px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.vbar .vtrack{flex:1;height:24px;background:var(--line2);border-radius:8px;overflow:hidden}
.vbar .vfill{display:block;height:100%;background:var(--acc-bg);border-radius:8px;min-width:3px;transition:width .5s ease}
.vbar.win .vfill{background:var(--heart)}
.vbar .vc{flex:none;font:700 13px var(--mono);width:18px;text-align:center;font-variant-numeric:tabular-nums}
.fam{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line2)}
.fam:last-child{border-bottom:0}
.fam b{flex:1;font-size:14.5px;font-weight:700}
body.gate .tabbar,body.gate .hdr{display:none}
/* ── 첫 화면 ──
   법랑 그린 한 색만 쓰고 나머지는 종이처럼 비워둔다. 로고는 상 위에 놓인 그릇 셋 —
   하나만 벽돌 레드로 두어 "오늘은 이걸로 정했다"가 읽히게 했다. */
body.gate{background:
  radial-gradient(120% 70% at 50% -10%, var(--soft) 0%, transparent 62%), var(--paper)}
.glogo{width:88px;height:88px;margin:0 auto;display:block}
.gwrap{text-align:center;padding:0 4px}
.gname{font-size:34px;font-weight:900;letter-spacing:-.055em;margin:18px 0 6px;color:var(--ink)}
.gname i{font-style:normal;color:var(--acc)}
.gsub{color:var(--sub);font-size:14px;line-height:1.6;letter-spacing:-.01em}
.gtag{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:6px 13px;
  border-radius:99px;background:var(--soft);color:var(--acc);font-size:12px;font-weight:700}
.gtag b{width:5px;height:5px;border-radius:99px;background:var(--heart);display:block}
.gacts{display:flex;flex-direction:column;gap:9px;margin-top:26px}
.gacts .btn{height:52px;font-size:15px;border-radius:15px}
.gacts .kko{background:#FEE500;color:#191919;font-weight:800}
.gacts .ggl{background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-weight:700}
.gacts .pk{background:transparent;color:var(--acc);font-weight:700;height:46px}
.gfoot{text-align:center;color:var(--sub);font-size:12.5px;margin-top:18px;line-height:1.65}
#syncdot{width:9px;height:9px;border-radius:99px;background:var(--line);display:inline-block;margin-right:3px}
#syncdot.on{background:#43A968}
.obcode{font:800 30px var(--mono);letter-spacing:.3em;text-align:center;color:var(--acc);
  background:var(--soft);border-radius:14px;padding:18px 8px 18px calc(8px + .3em);margin:14px 0;user-select:all}
/* ── 둘러보기 투어 ── */
.tour{position:fixed;left:0;right:0;z-index:70;display:flex;justify-content:center;pointer-events:none;
  bottom:calc(96px + env(safe-area-inset-bottom));padding:0 14px}
.tourin{pointer-events:auto;width:100%;max-width:492px;background:var(--card);border:1px solid var(--line);
  border-radius:20px;box-shadow:0 10px 34px rgba(18,17,17,.2);padding:16px 18px 14px}
.tourin .tstep{font:700 10px var(--mono);letter-spacing:.2em;color:var(--acc)}
.tourin h4{font-size:18px;font-weight:900;letter-spacing:-.04em;margin:6px 0 5px;text-wrap:balance}
.tourin p{font-size:13.5px;color:var(--sub);line-height:1.55}
/* 진행 점은 윗줄, 버튼은 아랫줄. 마지막 단계는 버튼이 셋이라 한 줄로는 빠듯해
   글자가 세로로 쪼개졌다. 줄을 나누고 버튼 글자는 절대 안 꺾이게 한다. */
.tourfoot{margin-top:14px;display:flex;flex-direction:column;gap:11px}
.tdots{display:flex;gap:5px}
.tdots i{width:6px;height:6px;border-radius:99px;background:var(--line);display:block}
.tdots i.on{background:var(--acc);width:16px}
.tacts{display:flex;align-items:center;gap:4px}
.tacts .skip{font-size:12.5px;font-weight:600;color:var(--sub);padding:9px 7px;
  white-space:nowrap;flex:none}
.tacts .next{margin-left:auto;background:var(--dark);color:var(--dark-ink);border-radius:99px;
  padding:11px 18px;font-size:13.5px;font-weight:700;white-space:nowrap;flex:none}
.tacts .next.go{background:var(--acc-bg);color:var(--acc-ink)}
@media (max-width:360px){
  .tacts .skip{font-size:12px;padding:9px 5px}
  .tacts .next{font-size:13px;padding:10px 15px}
}
.demobar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;
  background:var(--dark);color:var(--dark-ink);border-radius:12px;padding:10px 12px 10px 14px;
  font-size:12.5px;font-weight:700}
.demobar button{background:var(--acc-bg);color:var(--acc-ink);border-radius:99px;padding:6px 14px;font-size:12px;font-weight:700}
.peekbar{width:100%;text-align:left}
.peekbar .pk{background:var(--acc-bg);color:var(--acc-ink);border-radius:99px;padding:6px 14px;
  font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.connbar{width:100%;margin-top:12px;background:var(--soft);color:var(--acc);border:1.5px solid var(--acc);
  border-radius:12px;padding:11px 14px;font-size:13px;font-weight:700;text-align:left;letter-spacing:-.01em;line-height:1.5}
/* 투표 중 알림 배너 — 가족이 투표를 올리면 홈 맨 위에 뜬다 */
.votebar{width:100%;margin-top:12px;display:flex;align-items:center;gap:11px;text-align:left;
  background:var(--heart);color:#fff;border-radius:12px;padding:11px 14px;font-weight:800;letter-spacing:-.01em}
.votebar .vbi{font-size:17px;line-height:1}
.votebar .vbt{flex:1;font-size:13.5px;line-height:1.45}
.votebar .vbt i{display:block;font-style:normal;font-weight:600;font-size:12px;opacity:.9;margin-top:1px}
.votebar .vbg{background:rgba(255,255,255,.22);border-radius:99px;padding:6px 13px;font-size:12px;font-weight:800;white-space:nowrap}
/* 투표 시트 우상단 내보내기 아이콘 — 손가락으로 누르기 충분한 크기 */
.vshare{position:absolute;top:2px;right:0;width:44px;height:44px;color:var(--ink);z-index:2}
/* 장보기 내보내기 미리보기 — 실제로 나갈 문구를 그대로 보여준다 */
.sspv{padding:15px 16px;white-space:pre-wrap;font-size:13px;line-height:1.8;
  color:var(--ink);letter-spacing:-.01em}
/* 보내기 시트: 체크된 것이 '장 봐올 것'이다 (장보기 탭의 체크는 '이미 샀음'이라 반대) */
.sitem.pick .cbox{background:var(--acc-bg);border-color:var(--acc-bg);color:var(--acc-ink)}

/* 조리 단위 → 구매 단위 변환 (2큰술을 사러 가는 게 아니라 1병을 산다) */
const COOK_UNITS=['큰술','작은술','컵','줌','적당량','인분','조각','쪽'];
const BUY_BOTTLE=/(간장|식초|맛술|미림|참기름|들기름|식용유|올리브유|포도씨유|카놀라유|액젓|피시소스|굴소스|소스|올리고당|물엿|꿀|스리라차|매실청|청주|소주|맥주|와인|우유|두유|생크림)/;
const BUY_BAG=/(마늘|가루|깨|아몬드|호두|땅콩|캐슈넛|잣|건포도|크랜베리|나물|상추|깻잎|시금치|루꼴라|바질|로메인|샐러드|콩나물|숙주|미역|다시마|김)/;
function buyUnitOf(n){n=String(n||'');
 if(BUY_BOTTLE.test(n))return '병';
 if(BUY_BAG.test(n))return '봉지';
 return '개'}
function fmtQty(v){const r=Math.round(v*10)/10;return String(r).replace(/\.0$/,'')}
function buyAmount(name,sums,mult){
 const parts=[]; let cookOnly=false;
 Object.entries(sums||{}).forEach(([u,n])=>{
  const v=n*mult;
  if(COOK_UNITS.includes(u)){cookOnly=true;return}
  if(u==='g'){ parts.push(v>=1000?fmtQty(v/1000)+'kg':fmtQty(v)+'g'); return }
  if(u==='ml'){ parts.push(v>=1000?fmtQty(v/1000)+'L':fmtQty(v)+'ml'); return }
  if(u==='kg'||u==='L'){ parts.push(fmtQty(v)+u); return }
  parts.push(Math.max(1,Math.ceil(v-0.001))+u);      // 개수 단위는 올림
 });
 if(!parts.length&&cookOnly)parts.push('1'+buyUnitOf(name));
 return parts.join(' + ')}
function scaleQty(q,mult){const n=parseFloat(String(q).replace(/[^\d.]/g,''));
 if(!isFinite(n)||!n)return null; const v=n*mult;
 return (Math.round(v*10)/10).toString().replace(/\.0$/,'')}
function shopData(){
 const wk=iso(weekOf(ui.shopWeek)); const map=new Map();
 const span=ui.shopSpan||1, mon=weekOf(ui.shopWeek), days=[];
 for(let i=0;i<span*7;i++){const d=new Date(mon);d.setDate(d.getDate()+i);days.push(d)}
 days.forEach(d=>{const p=S.plan[iso(d)]||{};
  MEALS.forEach(([mk])=>{const m=p[mk]?menu(p[mk]):null; if(!m)return;
   (m.ingredients||[]).forEach(g=>{const key=g.name.trim(); if(!key)return;
    const e=map.get(key)||{name:key,brand:'',photo:'',url:'',uses:[],sums:{}};
    if(!e.brand&&g.brand)e.brand=g.brand; if(!e.photo&&g.photo)e.photo=g.photo;
    if(!e.url&&g.url)e.url=g.url;
    const sp=g.qty!=null?{qty:g.qty,unit:g.unit||''}:splitAmount(g.amount);
    const n=numOf(sp.qty);
    if(isFinite(n)&&n&&sp.unit)e.sums[sp.unit]=(e.sums[sp.unit]||0)+n;
    e.uses.push({m:m.name,a:g.amount});
    map.set(key,e)})})});
 const extras=(S.extra[wk]||[]);
 const base=Math.max(1,S.people||famAll().length||2), ppl=Math.max(1,ui.people||base), mult=ppl/base;
 const items=[...map.values()].map(e=>Object.assign(e,{need:buyAmount(e.name,e.sums,mult),ppl,mult}));
 return {wk,items,extras,ppl,base};
}

let SHEETS=[],seq=0;
function sheet(html){const id='sh'+(++seq);const w=document.createElement('div');w.className='sw';w.id=id;
 w.innerHTML=`<div class="sb" data-a="shClose"></div><div class="sp"><div class="grabzone"><div class="grab"></div></div>${html}</div>`;
 document.body.appendChild(w);
 const sp=w.querySelector('.sp'),gz=w.querySelector('.grabzone');   // 끌어내려 닫기
 let sy=0,cur=0,drag=false;
 gz.addEventListener('pointerdown',e=>{drag=true;sy=e.clientY;sp.style.transition='none';
  try{gz.setPointerCapture(e.pointerId)}catch(_){}});
 gz.addEventListener('pointermove',e=>{if(!drag)return;
  cur=Math.max(0,e.clientY-sy);sp.style.transform=`translateY(${cur}px)`});
 const dragEnd=()=>{if(!drag)return;drag=false;sp.style.transition='';sp.style.transform='';
  if(cur>110)shClose();cur=0};
 gz.addEventListener('pointerup',dragEnd);gz.addEventListener('pointercancel',dragEnd);
 requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('on')));
 SHEETS.push(id);document.body.classList.add('lock');
 if(history.state&&history.state.sheet)history.replaceState({sheet:1},'');
 else history.pushState({sheet:1},'');
 return id}
function shClose(){const id=SHEETS.pop();const w=id&&document.getElementById(id);if(!w)return;
 w.classList.remove('on');w.classList.add('closing');setTimeout(()=>w.remove(),280);
 if(!SHEETS.length)document.body.classList.remove('lock')}
function shCloseAll(){while(SHEETS.length)shClose()}
/* 모바일 뒤로가기 = 시트 닫기 (가드 1개 유지 방식) */
window.addEventListener('popstate',()=>{ if(SHEETS.length){ shClose();
  if(SHEETS.length)history.pushState({sheet:1},'') } });

/* ── 메모 붙여넣기 등록 (규칙 기반 파서, LLM 불사용) ── */
const QTY_RE=/(약\s*)?((\d+[\d\/.~\-]*)|반(의\s*반)?|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열)\s*(g|kg|ml|L|l|cc|개|큰\s*술|작은\s*술|스푼|숟갈|티스푼|컵|알|장|줌|모|포기|봉지?|팩|단|마리|조각|쪽|인분|근|공기|줄|톨|꼬집|방울|T|t)(?=\W|$)/;
function splitIngredient(s){
 s=s.replace(/^[-*·•]\s*/,'').trim();
 let brand='';
 const b=s.match(/\(([^)]+)\)\s*$/);
 if(b){brand=b[1].trim();s=s.slice(0,b.index).trim()}
 const m=s.match(QTY_RE);
 if(m&&m.index>0)return {name:s.slice(0,m.index).replace(/[:,]\s*$/,'').trim(),amount:s.slice(m.index).trim(),brand,photo:''};
 return {name:s,amount:'',brand,photo:'',qty:'1',unit:unitFor(s)}}
function parseRecipes(text){
 const blocks=String(text||'').replace(/\r/g,'').split(/\n\s*\n+/).map(b=>b.trim()).filter(Boolean);
 const out=[];
 for(const block of blocks){
  const lines=block.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length)continue;
  const r={name:'',ingredients:[],steps:[],memo:''};
  let mode='';
  lines.forEach((ln,i)=>{
   if(i===0){r.name=ln.replace(/^[#\-*·•\s]+/,'').trim();return}
   if(/^(재료|준비물)\s*[:：]?/.test(ln)){mode='ing';
    const rest=ln.replace(/^(재료|준비물)\s*[:：]?\s*/,'');
    if(rest)rest.split(/[,，]/).forEach(p=>{p=p.trim();if(p)r.ingredients.push(splitIngredient(p))});
    return}
   if(/^(만드는\s*법|만들기|조리법|순서|레시피)\s*[:：]?$/.test(ln)){mode='step';return}
   if(/^(메모|팁|tip)\s*[:：]?/i.test(ln)){mode='memo';
    const rest=ln.replace(/^(메모|팁|tip)\s*[:：]?\s*/i,'');
    if(rest)r.memo+=(r.memo?'\n':'')+rest;return}
   const stepM=ln.match(/^\d+\s*[.)]\s*(.+)$/)||ln.match(/^[①②③④⑤⑥⑦⑧⑨⑩]\s*(.+)$/);
   if(stepM){mode='step';r.steps.push(stepM[1].trim());return}
   if(mode==='step'){r.steps.push(ln.replace(/^[-*·•]\s*/,''));return}
   if(mode==='memo'){r.memo+=(r.memo?'\n':'')+ln;return}
   if(QTY_RE.test(ln)||(/[,，]/.test(ln)&&ln.length<60)){mode='ing';
    ln.split(/[,，]/).forEach(p=>{p=p.trim();if(p)r.ingredients.push(splitIngredient(p))});return}
   if(mode==='ing'&&ln.length<=20){r.ingredients.push(splitIngredient(ln));return}
   r.memo+=(r.memo?'\n':'')+ln});
  if(r.name)out.push(r)}
 return out}

function productLabel(name){

function logTime(t){const d=new Date(t),m=Math.round((Date.now()-d)/60000);
 if(m<1)return'방금';if(m<60)return m+'분 전';if(m<1440)return Math.round(m/60)+'시간 전';

function gameHead(t,e){return `<div class="sec-h" style="margin-top:4px"><div><div class="eyebrow">${e}</div><h2>${t}</h2></div></div>
 <div class="mchips">${MEALS.map(([k,v])=>`<button class="chip ${G.meal===k?'on':''}" data-a="gmeal" data-m="${k}">${v}</button>`).join('')}</div>`}

function openLadder(){ if(S.menus.length<2){toast('메뉴가 2가지는 있어야 사다리를 타요');return}
 G={meal:'d',mode:'ladder'};
 const pool=[...S.menus].sort(()=>Math.random()-.5);
 G.cands=pool.slice(0,Math.min(4,pool.length));
 const K=G.cands.length,W=320;
 G.xs=Array.from({length:K},(_,i)=>Math.round(K===2?100+i*120:32+i*((W-64)/(K-1))));
 const top=58,bot=292,L=7;
 G.ys=Array.from({length:L},(_,i)=>Math.round(top+(i+1)*(bot-top)/(L+1)));
 G.top=top;G.bot=bot;
 G.rungs=[];
 G.ys.forEach(y=>{const cols=[...Array(K-1).keys()].sort(()=>Math.random()-.5);const placed=[];
  cols.forEach(c=>{if(Math.random()<.58&&!placed.some(p=>Math.abs(p-c)<=1)){placed.push(c);G.rungs.push({y,c})}});
  if(!placed.length&&Math.random()<.7){const c=Math.floor(Math.random()*(K-1));G.rungs.push({y,c})}});
 const rails=G.xs.map(x=>`<line class="rail" x1="${x}" y1="${top}" x2="${x}" y2="${bot}"/>`).join('');
 const rungs=G.rungs.map(r=>`<line class="rung" x1="${G.xs[r.c]}" y1="${r.y}" x2="${G.xs[r.c+1]}" y2="${r.y}"/>`).join('');
 const starts=G.xs.map((x,i)=>`<g class="snode" id="sn${i}" data-a="lgo" data-i="${i}" style="cursor:pointer">
   <circle cx="${x}" cy="34" r="15"/><text x="${x}" y="39" text-anchor="middle">${i+1}</text></g>`).join('');
 const cands=G.cands.map((m,i)=>`<text class="cand" id="cd${i}" x="${G.xs[i]}" y="316" text-anchor="middle">${esc(m.name.length>6?m.name.slice(0,6)+'…':m.name)}</text>`).join('');
 sheet(`<div class="game">${gameHead('사다리 타기','Ladder Game')}
  <div class="ghint" id="lhint">번호를 하나 골라서 눌러보세요</div>
  <svg class="lsvg" viewBox="0 0 320 332" id="lsvg">${rails}${rungs}<path class="trail" id="ltrail" d=""/>${starts}${cands}</svg>
  <div class="gacts" id="gacts" style="visibility:hidden">
   <button class="btn gho" data-a="ladderAgain">한 번 더</button>
   <button class="btn pri" id="gdecide" data-a="decide">이걸로 결정</button></div></div>`)}
function ladderGo(i){ if(G.ran)return; G.ran=true;
 $('#sn'+i).classList.add('hot');
 let rail=i;const pts=[[G.xs[rail],34]];
 G.ys.forEach(y=>{pts.push([G.xs[rail],y]);
  const r=G.rungs.find(r=>r.y===y&&(r.c===rail||r.c===rail-1));
  if(r){rail=(r.c===rail)?rail+1:rail-1;pts.push([G.xs[rail],y])}});
 pts.push([G.xs[rail],G.bot]);
 G.pickId=G.cands[rail].id;
 const p=$('#ltrail');p.setAttribute('d','M'+pts.map(q=>q.join(' ')).join(' L '));
 const len=p.getTotalLength();
 p.style.strokeDasharray=len;p.style.strokeDashoffset=len;p.style.transition='none';
 requestAnimationFrame(()=>{p.style.transition='stroke-dashoffset 1.5s cubic-bezier(.55,.06,.35,1)';p.style.strokeDashoffset='0'});
 setTimeout(()=>{const cd=$('#cd'+rail);if(!cd)return;cd.classList.add('win');
  $('#lhint').textContent=`오늘의 ${MEAL[G.meal]}은 — ${G.cands[rail].name}!`;
  $('#gacts').style.visibility='visible';$('#gdecide').dataset.id=G.pickId},1550)}

function decide(id){const m=menu(id||G.pickId);if(!m)return;
 setPlan(todayISO(),G.meal,m.id);shCloseAll();go('home');
 toast(`오늘 ${MEAL[G.meal]}은 ${m.name}! 식단표에도 넣어뒀어요`)}

/* 우리집 식구 — 실제로 합류한 사람만. 여기서 할 수 있는 건 '초대하기'뿐이다. */
function openMembers(){

 sheet(`<div class="shead"><button class="x icobtn" data-a="shClose" aria-label="닫기">${I.lt}</button><b>우리집 식구</b></div>

   <div class="ghint">링크가 안 열린다고 하면 초대 코드 <b style="font-family:var(--mono);letter-spacing:.2em">${esc((HOMEINFO&&HOMEINFO.code)||'')}</b> 를 알려주세요.</div>`:''}`)}

/* ═══════════ 서버 동기화 (Supabase) ═══════════ */
let sb=null,HOME=null,ME=null,HOMEINFO=null,MEMBERS=[],syncOn=false,pendingHash=null,LIVE=null,AUTHUSER=null;
let ISADMIN=false,WANTLOG=false;

/* ── 접속 로그 (테스트 관찰용) ──
   기기 단위로 "언제 들어와서 어디까지 갔는지"만 남긴다. 실패해도 앱은 그대로 굴러가야 하므로 전부 조용히 삼킨다. */
let DEVID=null;
function devId(){ if(DEVID)return DEVID;
 try{DEVID=localStorage.getItem('otDev')}catch(e){}
 if(!DEVID){DEVID=uid();try{localStorage.setItem('otDev',DEVID)}catch(e){}}
 return DEVID}
function logVisit(event,detail){
 if(!sb)return;            // 로컬·오프라인 모드에서는 남길 곳이 없다
 if(ui.peek)return;        // 둘러보기는 예시일 뿐 — 서버에 흔적을 남기지 않는다
 try{ sb.from('visits').insert({device:devId(),user_id:AUTHUSER?AUTHUSER.id:null,home_id:HOME||null,
  event,detail:String(detail||'').slice(0,120),ref:(document.referrer||'').slice(0,180),
  ua:(navigator.userAgent||'').slice(0,180)}).then(()=>{},()=>{}) }catch(e){}}
function logOnce(event,detail){   // 한 번 세션에 한 번만 (식단 배치처럼 반복되는 동작용)
 try{if(sessionStorage.getItem('otL_'+event))return;sessionStorage.setItem('otL_'+event,'1')}catch(e){}
 logVisit(event,detail)}
function updateSyncBadge(){const d=$('#syncdot');if(!d)return;
 d.classList.toggle('on',syncOn);d.title=syncOn?'우리집 계정 연결됨':'로컬 모드';
 updateGreeting(); if(S)render()}
function updateGreeting(){const b=$('#hnm'),h=$('#hi');if(!b)return;
 const me=(typeof ME!=='undefined'&&ME&&ME.name)?ME.name:'';
 b.textContent=me?me+'님':'우리테이블';
 h.textContent=me?'안녕하세요 👋':'우리 가족의 맛있는 기록';}
/* 로그인하고 돌아오면 주소 뒤에 토큰이 붙어 있다(#access_token=…).
   supabase-js가 그걸 읽어 세션을 만드는데, 우리가 먼저 주소를 청소해버리면
   토큰이 사라져 "로그인했는데 다시 로그인 화면"이 된다. 그래서 인증 관련 값이
   붙어 있는 동안에는 주소를 건드리지 않는다. 청소는 세션이 잡힌 뒤에 한다. */
const AUTHPARAM=/(access_token|refresh_token|provider_token|error_description|error_code|[?&#]error=|[?&#]code=)/;
function hasAuthParam(){return AUTHPARAM.test(location.hash||'')||AUTHPARAM.test(location.search||'')}
function parseHash(){const h=location.hash;if(!h)return;
 let m=h.match(/vote=([\w-]+)/);if(m)pendingHash={vote:m[1]};
 m=h.match(/join=([A-Za-z0-9]+)/);if(m)pendingHash=Object.assign(pendingHash||{},{join:m[1]});
 if(pendingHash)try{sessionStorage.setItem('otPending',JSON.stringify(pendingHash))}catch(e){}  // 로그인 리다이렉트에도 살아남게
 if(hasAuthParam())return;
 cleanUrl()}
function cleanUrl(){try{history.replaceState(history.state,'',location.pathname)}catch(e){}}
/* 로그인이 실패하면 Supabase가 이유를 주소에 실어 돌려보낸다. 예전엔 이걸 아무도 안 읽어서
   화면만 깜빡이고 끝났다 — 이제는 사용자에게 보여준다. */
function oauthError(){
 const s=(location.hash||'')+'&'+(location.search||'');
 const pick=k=>{const m=s.match(new RegExp('[?#&]'+k+'=([^&]*)'));
  return m?decodeURIComponent(m[1].replace(/\+/g,' ')):''};
 const desc=pick('error_description'), code=pick('error_code')||pick('error');
 if(!desc&&!code)return '';
 return {raw:desc||code, msg:oauthMsg(desc||code)}}
/* 로그인 실패 사유는 영어로 온다. 그대로 보여주면 아무도 못 알아보니 할 일을 알려주는 말로 바꾼다.
   가장 흔한 건 '시간 초과' — 로그인 요청은 5분만 유효해서, 카카오·구글 화면에서 오래 머무르면 만료된다. */
function oauthMsg(e){const t=String(e||'').toLowerCase();
 if(t.includes('expired')||t.includes('state'))return '시간이 좀 지나서 다시 해야 해요. 한 번 더 눌러주세요';
 if(t.includes('access_denied')||t.includes('cancel'))return '로그인을 취소하셨어요';
 if(t.includes('email'))return '이메일 제공에 동의해야 로그인할 수 있어요';
 if(t.includes('disabled')||t.includes('provider'))return '지금은 이 방법으로 로그인할 수 없어요';
 if(t.includes('network')||t.includes('timeout'))return '인터넷 연결을 확인하고 다시 눌러주세요';
 return '다시 한 번 눌러주세요'}
function restorePending(){if(!pendingHash)try{const p=sessionStorage.getItem('otPending');if(p)pendingHash=JSON.parse(p)}catch(e){}}
function consumePending(){pendingHash=null;try{sessionStorage.removeItem('otPending')}catch(e){}}
async function syncInit(){
 if(!window.OT_CONFIG)return;
 try{const mod=await import('https://esm.sh/@supabase/supabase-js@2');
  sb=mod.createClient(OT_CONFIG.url,OT_CONFIG.anon)}catch(e){return} // 아티팩트/오프라인 → 로컬 모드
 logVisit('open');   // 로그인 전에도 남긴다 — 들어왔다 그냥 나간 사람이 여기서 잡힌다
 try{
  parseHash();restorePending();
  const oerr=oauthError();
  let {data:{session}}=await sb.auth.getSession();
  if(!session){cleanUrl();ui.gate=true;render();
   // 조용히 튕기지 않는다 — 사람 말로 알려주고, 원인 추적용 원문은 로그에 남긴다
   if(oerr){toast(oerr.msg,4200);logVisit('login_fail',oerr.raw)}
   if(WANTLOG)openVisitLog();return}                  // 최초 접속 = 로그인부터
  cleanUrl();                                         // 세션이 잡혔으니 주소에서 토큰을 지운다
  AUTHUSER=session.user;
  try{const {data:adm}=await sb.rpc('is_admin');ISADMIN=!!adm}catch(e){}
  const ok=await connectAsMember(true);
  if(!ok)await autoSetup();          // 우리집이 없으면 묻지 않고 만들거나 합류시킨다
  else if(pendingHash&&pendingHash.join)await joinFromLink();
  if(WANTLOG){shCloseAll();openVisitLog()}
 }catch(e){}
 updateSyncBadge()}
/* 이 폰에 담긴 메뉴·식단·장보기가 어느 집 것인지는 S._home으로 표시해둔다.
   초대를 타고 다른 집으로 옮기면 옛 집 데이터를 반드시 비워야 한다 —
   안 그러면 옛 메뉴가 새 집 목록에 남아, 같은 집인데도 폰마다 목록이 달라진다. */
function resetLocalForHome(){
 S.menus=[];S.plan={};S.extra={};S.checked={};S._dirty={};S.seq=2;S.today=null;save()}
async function connectAsMember(initial,justCreated){
 const u=await sb.auth.getUser();const uid_=u.data&&u.data.user&&u.data.user.id;if(!uid_)return false;
 AUTHUSER=u.data.user;
 const {data:mem,error}=await sb.from('members').select('*');
 if(error||!mem)return false;
 // 초대 링크를 타고 다른 집에 합류했을 수 있다 — 가장 최근에 들어간 집을 본다
 const mine=mem.filter(x=>x.user_id===uid_)
  .sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));
 ME=mine[0];
 if(!ME)return false;
 HOME=ME.home_id;MEMBERS=mem.filter(x=>x.home_id===HOME);
 syncOn=true;updateSyncBadge();
 const {data:hi}=await sb.from('homes').select('*').eq('id',HOME).maybeSingle();if(hi)HOMEINFO=hi;

 if(S._home&&S._home!==HOME)resetLocalForHome();   // 다른 집으로 옮겨왔다 → 폰을 비우고 새 집 것만 받는다
 // 이 폰의 데이터를 '내 것'으로 볼 수 있는 경우에만 서버로 올린다.
 // 남의 집에 합류하면서 내 폰 메뉴를 가족 메뉴판에 쏟아붓지 않도록.
 const ownData=(S._home===HOME)||!!justCreated||(!S._home&&MEMBERS.length<=1);
 if(ownData)await flushDirty();
 const {count}=await sb.from('menus').select('id',{count:'exact',head:true}).eq('home_id',HOME);
 if(!count&&ownData&&S.menus.length)await pushLocalAll();   // 내가 만든 집이 비어 있으면 이 폰 데이터 이관
 else if(!await pullAll()){
  toast('가족 데이터를 불러오지 못했어요 — 인터넷을 확인해주세요',4000);
  return true}                                    // 로그인은 살아 있으니 우리집을 새로 만들면 안 된다
 S._home=HOME;save();
 subscribeRT();
 checkOpenVote();
 if(pendingHash&&pendingHash.vote){const v=pendingHash.vote;consumePending();openVoteLive(v)}
 return true}

/* ── 시작 처리 (물어보지 않고 알아서) ──
   로그인은 했는데 아직 우리집이 없는 사람은 둘 중 하나다.
     · 초대 링크로 온 사람  → 그 집에 합류
     · 그냥 온 사람        → 자기 집을 만듦
   어느 쪽이든 화면에서 고르게 하지 않는다. 이름은 카카오·구글 프로필에서 가져오고,
   마음에 안 들면 바로 다음 화면에서 고칠 수 있다. */
function profileName(){const m=(AUTHUSER&&AUTHUSER.user_metadata)||{};
 return String(m.full_name||m.name||m.user_name||m.preferred_username||'').trim().slice(0,20)||'나'}
async function autoSetup(){
 if(!sb||!AUTHUSER)return;
 const nm=profileName();
 const jc=pendingHash&&pendingHash.join?pendingHash.join:'';
 if(jc){
  try{
   const {error}=await sb.rpc('join_home',{invite_code:jc,member_name:nm});
   if(error)throw error;
   consumePending();logVisit('join',nm);
   if(await connectAsMember(false)){shCloseAll();openWelcome(true);return}
  }catch(e){consumePending();toast('초대 링크가 더 이상 유효하지 않아요')}
 }
 try{
  const {data,error}=await sb.rpc('create_home',{member_name:nm});
  if(error)throw error;
  HOMEINFO={id:data[0].home_id,code:data[0].code};
  logVisit('home_new',nm);
  await connectAsMember(false,true);   // 내가 방금 만든 집 → 이 폰 데이터를 올려도 된다
  shCloseAll();openWelcome(false);
 }catch(e){toast('시작하지 못했어요 — 인터넷을 확인해주세요')}}
/* 환영 화면 — 만든 사람에겐 '초대 보내기'가, 합류한 사람에겐 '시작하기'가 큰 버튼이다. */
function openWelcome(joined){
 const c=(HOMEINFO&&HOMEINFO.code)||'';
 const fam=MEMBERS.filter(x=>x.home_id===HOME&&(!ME||x.id!==ME.id)).map(x=>esc(x.name)).join(', ');
 sheet(`<div class="vturn"><div class="vt1">${joined?'Welcome':'Our Table'}</div>
  <div class="vt2">${joined?'우리집에 합류했어요!':'우리집이 생겼어요!'}</div>
  <div class="vt3">${joined?(fam?`${fam} 님과 같은 메뉴판·식단·장보기를<br>이제 함께 봐요.`:'이제 가족과 같은 메뉴판을 함께 봐요.')
   :'가족에게 링크를 보내면,<br>링크를 열고 로그인하는 것만으로 합류돼요.'}</div></div>
  <div class="fld"><label>가족에게 보일 내 이름</label>
   <input id="wl-name" class="in" placeholder="예) 엄마 / 아빠 / 하몽" value="${esc(ME?ME.name:'')}" autocomplete="off"></div>
  <div class="dacts">
   ${joined?'':`<button class="btn pri blk" data-a="shareInvite">가족 초대 링크 보내기</button>`}
   <button class="btn ${joined?'pri':'gho'} blk" data-a="wlDone">시작하기</button></div>
  ${joined?'':`<div class="mut" style="margin-top:12px;text-align:center">링크가 안 열린다고 하면 초대 코드 <b style="font-family:var(--mono);letter-spacing:.2em">${esc(c)}</b> 를 알려주세요.</div>`}`)}
/* 이미 우리집이 있는 사람이 초대 링크를 열었을 때 — 말없이 옮기지 않고 한 번 물어본다. */
async function joinFromLink(){
 const c=pendingHash&&pendingHash.join;if(!c)return;
 if(HOMEINFO&&String(HOMEINFO.code)===String(c).toUpperCase()){consumePending();return}  // 이미 그 집 식구
 openConfirm('가족이 보낸 초대예요. 이 우리집으로 옮길까요?','네, 합류할게요',async()=>{
  try{const {error}=await sb.rpc('join_home',{invite_code:c,member_name:(ME&&ME.name)||profileName()});
   if(error)throw error;

/* ── 당겨오기 · 실시간 ── */
let pullT=null;
function pullSoon(){clearTimeout(pullT);pullT=setTimeout(()=>pullAll(),400)}
/* 집 조건(eq home_id)을 반드시 건다.
   RLS는 "내가 속한 모든 집"을 허용하므로, 두 집 식구인 사람이 조건 없이 읽으면
   양쪽 메뉴가 합쳐져 온다 — 같은 집인데 폰마다 목록이 다르게 보이던 원인이다. */
async function pullAll(){if(!HOME)return false;
 try{
 const H=HOME;
 const [me,pl,ex,ck,mb]=await Promise.all([
  sb.from('menus').select('*').eq('home_id',H).eq('deleted',false).order('no'),
  sb.from('plans').select('*').eq('home_id',H),
  sb.from('shopping_extras').select('*').eq('home_id',H),
  sb.from('shopping_checked').select('*').eq('home_id',H),
  sb.from('members').select('*').eq('home_id',H)]);
 if(me.error)throw me.error;
 if(pl.error||ex.error||ck.error||mb.error)throw (pl.error||ex.error||ck.error||mb.error);
 if(H!==HOME)return false;   // 받아오는 사이에 집이 바뀌었으면 옛 결과를 덮어쓰지 않는다
 S.menus=(me.data||[]).map(r=>({id:r.id,no:r.no,name:r.name,cat:r.cat||'',rating:r.rating||0,
  cookCount:r.cook_count||0,lastCookedAt:r.last_cooked_at||'',photo:r.photo_url||'',memo:r.memo||'',
  ingredients:r.ingredients||[],steps:r.steps||[],createdAt:r.created_at,updatedAt:r.updated_at}));
 S.seq=Math.max(2,...S.menus.map(m=>(m.no||0)+1),S.menus.length+1);
 S.plan={};(pl.data||[]).forEach(r=>{(S.plan[r.date]=S.plan[r.date]||{})[r.meal]=r.delivery?'DELIV':r.menu_id});
 S.extra={};(ex.data||[]).forEach(r=>{(S.extra[r.week]=S.extra[r.week]||[]).push({id:r.id,name:r.name,amount:r.amount||''})});
 S.checked={};(ck.data||[]).forEach(r=>{if(r.checked)S.checked[r.week+'|'+r.item_key]=true});
 if(mb.data)MEMBERS=mb.data;
 autoCount();save();updateGreeting();render();return true}catch(e){return false}}
let RTCH=null;
function subscribeRT(){if(RTCH||!sb)return;
 RTCH=sb.channel('home-sync');
 ['menus','plans','shopping_extras','shopping_checked','votes','ballots'].forEach(t=>{
  RTCH.on('postgres_changes',{event:'*',schema:'public',table:t},()=>{
   if(t==='ballots'||t==='votes'){refreshVoteLive();checkOpenVote()}
   pullSoon()})});
 RTCH.subscribe()}
window.addEventListener('online',()=>{if(syncOn)flushDirty()});

/* ── 올리기 ── */
function dirty(t,k){((S._dirty=S._dirty||{})[t]=S._dirty[t]||{})[k]=true;save();
 toast('저장은 됐어요 — 인터넷 연결되면 가족에게도 반영돼요')}
async function flushDirty(){const D=S._dirty||{};
 for(const id of Object.keys(D.menus||{})){const m=menu(id);
  if(m)await pushMenu(m,true);else await pushMenuDelete(id,true)}
 for(const k of Object.keys(D.plans||{})){const i=k.indexOf('|');
  await pushPlan(k.slice(0,i),k.slice(i+1),(S.plan[k.slice(0,i)]||{})[k.slice(i+1)]??null,true)}
 S._dirty={};save()}
async function maybeUpload(p){if(!p||!p.startsWith('data:'))return p||'';
 const blob=await (await fetch(p)).blob();
 const path=HOME+'/'+uid()+'.jpg';
 const {error}=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'});
 if(error)throw error;
 return sb.storage.from('photos').getPublicUrl(path).data.publicUrl}
async function pushMenu(m,noDirty){try{
 m.photo=await maybeUpload(m.photo);
 for(const g of m.ingredients||[])g.photo=await maybeUpload(g.photo);
 save();
 const {error}=await sb.from('menus').upsert({id:m.id,home_id:HOME,no:m.no||0,name:m.name,
  cat:m.cat||'',rating:m.rating||0,cook_count:m.cookCount||0,last_cooked_at:m.lastCookedAt||null,
  photo_url:m.photo||'',memo:m.memo||'',ingredients:m.ingredients||[],steps:m.steps||[],
  deleted:false,updated_at:new Date().toISOString()});
 if(error)throw error}catch(e){if(!noDirty)dirty('menus',m.id)}}
async function pushMenuDelete(id,noDirty){try{
 const {error}=await sb.from('menus').update({deleted:true,updated_at:new Date().toISOString()}).eq('id',id);
 if(error)throw error}catch(e){if(!noDirty)dirty('menus',id)}}
async function pushPlan(date,meal,val,noDirty){try{
 if(val==null){const {error}=await sb.from('plans').delete().match({home_id:HOME,date,meal});if(error)throw error}
 else{const {error}=await sb.from('plans').upsert({home_id:HOME,date,meal,
  menu_id:val==='DELIV'?null:val,delivery:val==='DELIV',updated_at:new Date().toISOString()});if(error)throw error}
}catch(e){if(!noDirty)dirty('plans',date+'|'+meal)}}
async function pushExtra(wk,x,del){try{
 if(del)await sb.from('shopping_extras').delete().eq('id',x.id);
 else await sb.from('shopping_extras').insert({id:x.id,home_id:HOME,week:wk,name:x.name,amount:x.amount||''});
}catch(e){}}
async function pushChecked(wk,key,on){try{
 if(on)await sb.from('shopping_checked').upsert({home_id:HOME,week:wk,item_key:key,checked:true,updated_at:new Date().toISOString()});
 else await sb.from('shopping_checked').delete().match({home_id:HOME,week:wk,item_key:key});
}catch(e){}}
async function pushLocalAll(){toast('우리집 계정에 올리는 중…');
 for(const m of S.menus)await pushMenu(m);
 for(const [dt,p] of Object.entries(S.plan||{}))for(const [ml,v] of Object.entries(p))if(v)await pushPlan(dt,ml,v);
 for(const [wk,xs] of Object.entries(S.extra||{}))for(const x of xs)await pushExtra(wk,x,false);
 for(const key of Object.keys(S.checked||{})){const i=key.indexOf('|');
  await pushChecked(key.slice(0,i),key.slice(i+1),true)}
 await pullAll();toast('다 올렸어요! 이제 가족과 같이 써요')}

async function vstartRemote(){V.cands=[...V.sel,...(V.deliv?['DELIV']:[])];

/* 개표는 vote_tally가 후보별 숫자만 돌려준다 — 누가 뭘 찍었는지는 서버 밖으로 안 나온다.
   내가 찍은 것만 내 표로 따로 읽어 표시한다. */
async function tallyOf(id,cands){
 const cnt={};(cands||[]).forEach(k=>cnt[k]=0);
 const {data}=await sb.rpc('vote_tally',{v_id:id});
 let total=0;(data||[]).forEach(r=>{if(cnt[r.choice]!=null)cnt[r.choice]=Number(r.cnt);total+=Number(r.cnt)});
 return {cnt,total}}
/* 그리기와 불러오기를 나눈다.
   전에는 후보를 누를 때마다 서버 왕복(투표 조회 → 개표 → 내 표 조회)이 끝나야
   화면이 바뀌어서, 눌러도 한참 반응이 없었다. 이제는 누른 즉시 화면부터 바꾸고
   서버에는 뒤이어 보낸다. */
function paintVoteLive(){
 const el=$('#vlive');if(!el||!LIVE)return;
 const v=LIVE.vote, closed=v.status==='closed';
 const cnt=LIVE.cnt||{}, total=LIVE.total||0, my=LIVE.my;
 const nm=k=>k==='DELIV'?'배달 찬스':(menu(k)?menu(k).name:'?');
 const denom=Math.max(1,MEMBERS.length);
 const bars=[...(v.candidates||[])].sort((a,b)=>(cnt[b]||0)-(cnt[a]||0)).map(k=>`<div class="vbar">
  <span class="vn">${esc(nm(k))}</span><span class="vtrack"><span class="vfill" style="width:${Math.round((cnt[k]||0)/denom*100)}%"></span></span>
  <span class="vc">${cnt[k]||0}</span></div>`).join('');
 const opts=closed?'':(v.candidates||[]).map(k=>`<button class="vopt ${my&&my.choice===k?'on':''}" data-a="vlCast" data-k="${k}">
  ${phEl(k==='DELIV'?DELIV:(menu(k)||{name:'?',no:0,photo:''}))}<span class="vnm">${esc(nm(k))}</span>${my&&my.choice===k?'<span class="cooked">내 표</span>':''}</button>`).join('');
 el.innerHTML=`${closed?'':`<button class="icobtn vshare" data-a="vlShare" aria-label="투표 링크 내보내기" title="아직 안 한 가족에게 링크 보내기">${I.share}</button>`}
  <div class="vturn" style="padding:8px 0 8px"><div class="vt1">${closed?'Result':'Family Vote'}</div>
  <div class="vt2">오늘 ${MEAL[v.meal]}, 뭐 먹을까?</div>
  <div class="vt3">${total} / ${MEMBERS.length}명 투표${closed?' · 마감됨':' · 실시간 개표 중'}</div></div>
  ${bars}
  ${opts?`<div style="margin-top:14px">${opts}</div>`:''}
  <div class="dacts">
   ${!closed&&total?`<button class="btn pri blk" data-a="vlFinish">마감하고 오늘 식단에 반영</button>`:''}
  </div>`}
async function refreshVoteLive(){
 if(!LIVE||!$('#vlive'))return;
 try{
  const id=LIVE.id;
  const [vr,tl,mb]=await Promise.all([
   sb.from('votes').select('*').eq('id',id).maybeSingle(),
   tallyOf(id,LIVE.vote.candidates),
   sb.from('ballots').select('*').eq('vote_id',id)]);   // 정책상 내 표만 온다
  if(!LIVE||LIVE.id!==id)return;
  if(vr.data)LIVE.vote=vr.data;
  LIVE.cnt=tl.cnt;LIVE.total=tl.total;LIVE.my=(mb.data||[])[0]||null;
  paintVoteLive()
 }catch(e){}}

/* ── 진행 중인 투표 알림 ──
   투표를 올리면 가족 폰에 실시간으로 신호가 간다. 앱이 열려 있으면 그 자리에서 토스트가 뜨고,
   나중에 열어도 홈 맨 위에 배너가 남아 있어 놓치지 않는다. */
let OPENVOTE=null, VOTESEEN=null;
async function checkOpenVote(){
 if(!sb||!HOME||!ME){OPENVOTE=null;return}
 try{
  const {data}=await sb.from('votes').select('*').eq('home_id',HOME).eq('status','open')
   .eq('date',todayISO()).order('created_at',{ascending:false}).limit(1);
  const v=(data||[])[0]||null;
  const changed=(v&&v.id)!==(OPENVOTE&&OPENVOTE.id);
  OPENVOTE=v;
  if(v){
   const {data:mine}=await sb.from('ballots').select('vote_id').eq('vote_id',v.id);
   OPENVOTE.mine=!!(mine||[]).length;
   const {total}=await tallyOf(v.id,v.candidates);OPENVOTE.total=total;
   // 남이 올린 새 투표이고 내가 아직 안 찍었으면 한 번 알려준다
   if(changed&&VOTESEEN!==v.id&&v.created_by!==ME.id&&!OPENVOTE.mine){
    VOTESEEN=v.id;toast(`오늘 ${MEAL[v.meal]} 뭐 먹을지 투표가 올라왔어요`,3800)}
  }
  if(changed||v)render()
 }catch(e){}}

 return `<button class="votebar" data-a="voteOpen"><span class="vbi">🗳</span>
  <span class="vbt">${done?`오늘 ${MEAL[v.meal]} 투표 진행 중`:`오늘 ${MEAL[v.meal]}, 뭐 먹을지 투표해주세요`}
   <i>${v.total||0} / ${MEMBERS.length}명 참여${done?' · 내 표 완료':''}</i></span>
  <span class="vbg">${done?'결과 보기':'투표하기'}</span></button>`}
async function vlCast(k){
 if(!LIVE||!ME)return;
 const before={my:LIVE.my,cnt:Object.assign({},LIVE.cnt),total:LIVE.total};
 // 누른 즉시 화면 반영 — 서버 응답을 기다리지 않는다
 const prev=LIVE.my&&LIVE.my.choice;
 LIVE.cnt=LIVE.cnt||{};
 if(prev===k)return;                                  // 같은 걸 다시 누름 — 할 일 없음
 if(prev)LIVE.cnt[prev]=Math.max(0,(LIVE.cnt[prev]||0)-1); else LIVE.total=(LIVE.total||0)+1;
 LIVE.cnt[k]=(LIVE.cnt[k]||0)+1;
 LIVE.my={choice:k};
 paintVoteLive();
 try{
  const {error}=await sb.from('ballots').upsert({vote_id:LIVE.id,member_id:ME.id,choice:k});
  if(error)throw error;
  refreshVoteLive();checkOpenVote()                   // 정확한 개표는 뒤따라 맞춘다
 }catch(e){
  Object.assign(LIVE,before);paintVoteLive();
  toast('투표가 안 들어갔어요 — 인터넷 확인')}}
async function vlFinish(){try{

 const {cnt}=await tallyOf(LIVE.id,v.candidates);
 const mx=Math.max(...Object.values(cnt));
 const ws=v.candidates.filter(k=>cnt[k]===mx);
 const win=ws[Math.floor(Math.random()*ws.length)];
 await sb.from('votes').update({status:'closed'}).eq('id',LIVE.id);
 setPlan(v.date,v.meal,win==='DELIV'?'DELIV':win);
 LIVE=null;OPENVOTE=null;shCloseAll();go('home');checkOpenVote();
 toast(win==='DELIV'?`오늘 ${MEAL[v.meal]}은 배달 찬스!`:`오늘 ${MEAL[v.meal]}은 ${menu(win)?menu(win).name:'결정'}!`)}
 catch(e){toast('마감하지 못했어요')}}
function vlShare(){if(!LIVE)return;

function grabPhoto(cb){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
 inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const img=new Image();
   img.onerror=()=>toast('사진을 읽지 못했어요 — 다른 사진으로 해주세요');
   img.onload=()=>{const mx=900,sc=Math.min(1,mx/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    cb(cv.toDataURL('image/jpeg',.82))};
   img.src=rd.result};
  rd.readAsDataURL(f)};
 inp.click()}

/* 새 창 열기 — 팝업 차단·iframe(에뮬레이터) 환경까지 대응 */
function openUrl(u){if(!u)return;
 try{const w=window.open(u,'_blank','noopener');if(w)return}catch(e){}
 try{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';
  document.body.appendChild(a);a.click();a.remove();return}catch(e){}
 try{navigator.clipboard.writeText(u);toast('링크를 복사했어요 — 브라우저에 붙여넣어 주세요')}catch(e){}}

function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.classList.add('on');
 clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),ms||2300)}

/* ── 둘러보기(peek)에서 허용하는 동작 ──
   예시를 구경만 하는 모드다. 화면을 넘겨보는 것과 투어 조작, 그리고 로그인하러 나가기만 된다.
   나머지는 전부 막는다 — 여기서 만든 것은 어차피 아무 데도 남지 않으므로,
   되지도 않을 일을 되는 것처럼 보여주지 않는 편이 낫다. */
const PEEK_OK=new Set([
 'go','detail','sort','filt','cat','wk','swk','span','hideDone','wday','planView','mnav','mday',
 'openDay','chWk','buy','open',                       // 읽기·탐색
 'tourNext','tourPrev','tourEnd','startNow','peek',   // 투어 조작
 'shClose','confYes']);                               // 시트 닫기
function peekBlocked(name){
 if(!ui.peek||PEEK_OK.has(name))return false;
 toast('둘러보기에서는 구경만 할 수 있어요 — 시작하려면 로그인해주세요',3000);
 return true}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;
 const a=ACT[el.dataset.a];if(!a)return;
 e.preventDefault();
 if(peekBlocked(el.dataset.a))return;
 // 하나가 실패해도 화면이 빈 채로 남지 않도록 — 조용히 죽지 말고 알린다
 try{const r=a(el.dataset,el,e); if(r&&r.catch)r.catch(err=>actFail(el.dataset.a,err))}
 catch(err){actFail(el.dataset.a,err)}});
function actFail(name,err){
 try{console.error('[action]',name,err)}catch(_){}
 toast('처리하지 못했어요 — 다시 눌러주세요',3200);
 if(sb&&HOME)logVisit('ui_error',name+': '+String(err&&err.message||err).slice(0,80))}
document.addEventListener('input',e=>{
 if(e.target.tagName==='TEXTAREA'&&(e.target.id==='qstep'||e.target.id==='f-memo'))autoGrow(e.target);
 if(e.target.id==='q'){ui.q=e.target.value;
  clearTimeout(ui._qt);ui._qt=setTimeout(()=>{const v=$('#q');const pos=v.selectionStart;render();
   const n=$('#q');if(n){n.focus();n.setSelectionRange(pos,pos)}},350)}});
document.addEventListener('keydown',e=>{   // 엔터로 빠른 입력 (한글 조합 중 중복 방지)
 if(e.key!=='Enter'||e.isComposing||e.keyCode===229)return;
 if(ui.peek){e.preventDefault();return}
 if(e.target.id==='qing'){e.preventDefault();ACT.qingAdd()}
 else if(e.target.id==='qstep'&&!e.shiftKey){e.preventDefault();ACT.stepAdd()}
 else if(e.target.id==='xn'||e.target.id==='xa'){e.preventDefault();ACT.xadd()}});
document.addEventListener('change',e=>{if(e.target.id==='impF')importJson(e.target.files[0]);
 if(e.target.classList&&e.target.classList.contains('i-n')){   // 재료명 고르면 브랜드 자동 채움
  const row=e.target.closest('.irow'),b=row&&row.querySelector('.i-b');
  if(b&&!b.value){const n=e.target.value.trim();
   outer:for(const m of S.menus)for(const g of m.ingredients||[])
    if(g.name===n&&g.brand){b.value=g.brand;break outer}}}});

   모이는 것까지 눈앞에서 벌어지게 한다. 이 앱의 값어치는 기능 하나하나가 아니라
   "한 번 적으면 나머지가 따라온다"는 연결에 있기 때문이다. */

 const old=$('#tour'); if(old)old.remove();
 if(TSTEP<0||TSTEP>=TOUR.length||ui.gate)return;
 const s0=TOUR[TSTEP];
 if(ui.tab!==s0.tab){ui.tab=s0.tab;render()}
 // 이 단계에 실연이 있으면 먼저 돌리고, 시트가 뜬 뒤에 카드를 그린다
 if(s0.setup&&TDONE!==TSTEP){TDONE=TSTEP;
  try{TOURACT[s0.setup]()}catch(e){}
  return setTimeout(tourRender,120)}
 if(!s0.setup&&SHEETS.length)shCloseAll();
 const el=document.createElement('div');el.className='tour';el.id='tour';
 el.innerHTML=`<div class="tourin">
   <div class="tstep">${TSTEP+1} / ${TOUR.length}</div>
   <h4>${s0.t}</h4><p>${s0.d}</p>
   <div class="tourfoot">
    <div class="tdots">${TOUR.map((_,i)=>`<i class="${i===TSTEP?'on':''}"></i>`).join('')}</div>
    <div class="tacts">
     ${TSTEP>0?`<button class="skip" data-a="tourPrev">이전</button>`:''}
     <button class="skip" data-a="tourEnd">그만 보기</button>
     <button class="next ${s0.last?'go':''}" data-a="${s0.last?'startNow':'tourNext'}">${s0.last?'로그인하고 시작':'다음'}</button>
    </div>
   </div></div>`;
 document.body.appendChild(el)}
function tourStart(){TSTEP=0;TDONE=-1;tourRender()}
/* 둘러보기는 빈 상태에서 시작한다.
   데모 데이터를 잔뜩 깔아두면 "내가 등록해서 생긴 것"인지 "원래 있던 것"인지 구별이 안 된다.
   비어 있다가 하나씩 채워지는 걸 봐야 연결이 보인다. 나갈 때 원래 데이터로 되돌린다. */
async function tourDemoStart(){
 try{localStorage.setItem('otBackup',JSON.stringify(S))}catch(e){}
 S=Object.assign(seed(),{menus:[],plan:{},extra:{},checked:{},counted:{},
   seq:2,family:[],today:null,_demo:true});
 ui=Object.assign(ui,{tab:'menus',week:0,shopWeek:0,shopSpan:1,q:'',cat:'',sort:'best',shopInit:false});
 await flush()}
function tourEnd(){TSTEP=-1;const t=$('#tour');if(t)t.remove()}

/* ═══════════ 데모 데이터 (홍보 촬영용 · #demo 로만 임시 로드) ═══════════ */
async function demoOn(){
 try{
  const r=await fetch('demo/seed.json',{cache:'no-store'});
  const j=await r.json();
  if(!S._demoBackup){try{localStorage.setItem('otBackup',JSON.stringify(S))}catch(e){}}
  const now=new Date().toISOString();
  const menus=j.menus.map((m,i)=>({id:'demo-'+i,no:i+1,name:m.name,cat:m.cat||'',rating:m.rating||0,
   cookCount:m.cookCount||0,lastCookedAt:'',createdAt:now,updatedAt:now,
   photo:m.photo?('demo/'+m.photo):'',memo:m.memo||'',
   ingredients:(m.ingredients||[]).map(g=>Object.assign({photo:'',url:'',brand:''},g,{amount:(g.qty||'')+(g.unit||'')})),
   steps:m.steps||[]}));
  const byName={}; menus.forEach(m=>byName[m.name]=m.id);
  const plan={};
  const mon0=monday(new Date());
  (j.plan||[]).forEach(p=>{let d;
   if(p.wd!=null){d=new Date(mon0);d.setDate(d.getDate()+p.wd)}
   else{d=new Date();d.setDate(d.getDate()+(p.offset||0))}
   const k=iso(d);(plan[k]=plan[k]||{})[p.meal]=byName[p.menu]});
  S={ver:1,seq:menus.length+1,menus,plan,extra:{},checked:{},counted:{},
     family:(j.family||[]).map((n,i)=>({id:'df'+i,name:n})),people:j.people||3,
     homeMeals:'d',shopSpanDefault:1,_demo:true};
  ui=Object.assign(ui,{tab:'home',gate:false,shopSpan:1,shopWeek:0,week:0,planView:'w',q:'',cat:''});
  await flush(); render();
  toast('데모 데이터를 올렸어요 — 촬영 끝나면 끄기를 눌러주세요');
 }catch(e){toast('데모 데이터를 불러오지 못했어요')}}
async function demoOff(){
 let prev=null; try{prev=JSON.parse(localStorage.getItem('otBackup')||'null')}catch(e){}
 S=prev||seed(); delete S._demo;
 try{localStorage.removeItem('otBackup')}catch(e){}
 await flush(); ui=Object.assign(ui,{tab:'home'}); render();
 toast('원래 데이터로 되돌렸어요');
 if(typeof syncOn!=='undefined'&&syncOn)pullAll()}

/* ═══════════ 시작 ═══════════ */
(async function init(){
 try{S=await dbGet()}catch(e){idbOK=false}
 if(!S){try{const ls=localStorage.getItem('ourtable');if(ls)S=JSON.parse(ls)}catch(e){}}
 if(!S){S=seed();flush()}
 if(!S.extra)S.extra={}; if(!S.checked)S.checked={}; if(!S.seq)S.seq=S.menus.length+1; if(!S.family)S.family=[];
 if(!S.counted)S.counted={}; if(!S.homeMeals)S.homeMeals='d'; if(!S.shopSpanDefault)S.shopSpanDefault=1;
 ui.shopSpan=S.shopSpanDefault;
 autoCount();
 render();
 if('serviceWorker' in navigator&&location.protocol==='https:')
  navigator.serviceWorker.register('sw.js').catch(()=>{});
 if(/[#&]log\b/.test(location.hash)){history.replaceState(null,'',location.pathname);WANTLOG=true}   // 만든 사람용 — 접속 로그
 if(/[#&]demo(=on)?\b/.test(location.hash)){history.replaceState(null,'',location.pathname);await demoOn();return}
 if(/[#&]demo=off\b/.test(location.hash)){history.replaceState(null,'',location.pathname);await demoOff();return}
 syncInit();
})();
</script>
