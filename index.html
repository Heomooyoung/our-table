<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리집 식탁</title>
<style>
/* ── 디자인 토큰: 종이 노트 × 법랑 그린. 밤에는 '밤의 주방' ── */
:root{
  --paper:#F4F4EF; --card:#FFFFFF; --ink:#212820; --sub:#6F7A6C;
  --line:#DFE1D6; --line2:#ECEDE5;
  --acc:#2C5B45; --acc-bg:#2C5B45; --acc-ink:#FFFFFF; --soft:#E9F0E9;
  --heart:#C2492F; --heart-soft:#F6E7E1;
  --sh:0 1px 2px rgba(30,40,30,.05),0 10px 28px rgba(30,40,30,.07);
  --kr:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --paper:#121813; --card:#1A231C; --ink:#E8ECE3; --sub:#92A08E;
    --line:#2A352C; --line2:#222C24;
    --acc:#92C6A8; --acc-bg:#2F6349; --acc-ink:#F2F7F0; --soft:#212E25;
    --heart:#E36F4F; --heart-soft:#33231C;
    --sh:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4);
  }
}
:root[data-theme=dark]{
  --paper:#121813; --card:#1A231C; --ink:#E8ECE3; --sub:#92A08E;
  --line:#2A352C; --line2:#222C24;
  --acc:#92C6A8; --acc-bg:#2F6349; --acc-ink:#F2F7F0; --soft:#212E25;
  --heart:#E36F4F; --heart-soft:#33231C;
  --sh:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.4);
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--kr);
  -webkit-font-smoothing:antialiased;min-height:100dvh}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}

#app{max-width:520px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom))}

/* ── 헤더 ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 6px}
.hdr .wm{display:flex;flex-direction:column;gap:1px}
.hdr .wm b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.hdr .wm span{font:600 9px var(--mono);letter-spacing:.28em;color:var(--sub);text-transform:uppercase}
.icobtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--sub)}
.icobtn:active{background:var(--line2)}

/* ── 섹션 공통 ── */
.eyebrow{font:700 10px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--acc)}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec-h h2{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-top:3px;text-wrap:balance}
.sec-h .cnt{font:600 11px var(--mono);color:var(--sub)}

/* ── 홈 히어로 ── */
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);
  padding:26px 22px 22px;margin-top:14px;position:relative;overflow:hidden}
.hero .date{font:600 10px var(--mono);letter-spacing:.24em;color:var(--sub);text-transform:uppercase}
.hero h1{font-size:33px;line-height:1.22;font-weight:900;letter-spacing:-.045em;margin:10px 0 6px;text-wrap:balance}
.hero .sub{color:var(--sub);font-size:13.5px}
.hero .acts{display:flex;gap:8px;margin-top:18px}
.hero-menu{display:flex;gap:14px;align-items:center;margin:14px 0 4px}
.hero-menu .ph,.hero-menu .mono-ph{width:86px;height:86px;border-radius:12px;flex:none}
.hero-menu .nm{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.3;text-wrap:balance}
.hero-menu .mt{font:600 11px var(--mono);color:var(--sub);margin-top:4px}

/* ── 주간 스트립 ── */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:2px}
.strip .dcol{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;
  display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.strip .dcol.today{border-color:var(--acc);border-width:1.5px}
.strip .dl{font:700 10px var(--mono);color:var(--sub);letter-spacing:.08em}
.strip .dn{font-size:10.5px;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip .dn.none{color:var(--line)}

/* ── 가로 레일 (베스트) ── */
.rail{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rcard{flex:0 0 132px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;text-align:left;position:relative}
.rcard .ph,.rcard .mono-ph{height:92px;border-radius:0}
.rcard .b{padding:9px 10px 11px}
.rcard .nm{font-size:13px;font-weight:700;letter-spacing:-.02em;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .rk{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--paper);
  font:700 9px var(--mono);letter-spacing:.1em;padding:3px 6px;border-radius:5px}
.rcard .rk.r1{background:var(--heart);color:#fff}

/* ── 사진 · 모노그램 ── */
.ph{background-size:cover;background-position:center;border-radius:10px}
.mono-ph{border-radius:10px;display:grid;place-items:center;position:relative;color:var(--acc);
  background:repeating-linear-gradient(0deg,transparent 0 13px,var(--line2) 13px 14px),var(--soft)}
.mono-ph b{font-size:30px;font-weight:900;letter-spacing:-.04em}
.mono-ph i{position:absolute;bottom:6px;right:8px;font:600 8px var(--mono);letter-spacing:.14em;font-style:normal;opacity:.55}

/* ── 메뉴판 ── */
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:0 12px;height:42px}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px}
.search input::placeholder{color:var(--sub);font-family:var(--mono);font-size:12px;letter-spacing:.08em}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12px;font-weight:600;color:var(--sub);border:1px solid var(--line);
  background:var(--card);border-radius:999px;padding:6px 12px;letter-spacing:-.01em}
.chip.on{background:var(--acc-bg);border-color:var(--acc-bg);color:var(--acc-ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;
  text-align:left;box-shadow:var(--sh);position:relative;display:flex;flex-direction:column}
.mcard .ph,.mcard .mono-ph{height:118px;border-radius:0}
.mcard .b{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.mcard .nm{font-size:14.5px;font-weight:800;letter-spacing:-.025em;line-height:1.35;text-wrap:balance}
.mcard .mt{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.mcard .no{position:absolute;top:8px;right:9px;font:600 9px var(--mono);letter-spacing:.12em;
  color:#fff;background:rgba(20,26,20,.42);padding:3px 6px;border-radius:5px;backdrop-filter:blur(4px)}
.mcard .mono-ph~.b~.no, .no.dim{color:var(--sub);background:none;backdrop-filter:none}
.cooked{font:600 10.5px var(--mono);color:var(--sub);letter-spacing:.04em}

/* ── 하트 ── */
.hearts{display:inline-flex;gap:2.5px}
.hearts svg{width:14px;height:14px;fill:var(--line);transition:fill .15s,transform .15s}
.hearts svg.on{fill:var(--heart)}
.hearts.big svg{width:26px;height:26px}
.hearts.tap svg:active{transform:scale(1.25)}

/* ── 식단표 ── */
.wknav{display:flex;align-items:center;justify-content:space-between;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:14px}
.wknav .wtit{text-align:center}
.wknav .wtit b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.wknav .wtit div{font:600 10px var(--mono);color:var(--sub);letter-spacing:.1em;margin-top:1px}
.wknav .icobtn{width:34px;height:34px}
.day{display:flex;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line2)}
.day:last-child{border-bottom:0}
.day .dt{width:40px;flex:none;text-align:center;padding-top:2px}
.day .dt .w{font:700 9.5px var(--mono);letter-spacing:.18em;color:var(--sub)}
.day .dt .n{font:700 19px var(--mono);letter-spacing:-.04em;margin-top:1px;font-variant-numeric:tabular-nums}
.day.today .dt .n{color:var(--acc)}
.day.today .dt .w{color:var(--acc)}
.slots{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.slot{display:flex;align-items:center;gap:8px;border:1px dashed var(--line);border-radius:10px;
  padding:8px 10px;min-height:38px;text-align:left;width:100%}
.slot .ml{font:700 9px var(--mono);letter-spacing:.16em;color:var(--sub);flex:none;width:26px}
.slot .snm{flex:1;min-width:0;font-size:13px;font-weight:600;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
.slot.fill{border-style:solid;background:var(--card);border-color:var(--line)}
.slot.fill .snm{color:var(--ink)}
.slot .sx{flex:none;width:22px;height:22px;display:grid;place-items:center;color:var(--sub);border-radius:7px}
.slot .sx:active{background:var(--line2)}

/* ── 장보기 ── */
.prog{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:13px}
.prog .pt{display:flex;justify-content:space-between;align-items:baseline}
.prog .pt b{font-size:14px;font-weight:800;letter-spacing:-.02em}
.prog .pt span{font:600 11px var(--mono);color:var(--sub);font-variant-numeric:tabular-nums}
.pbar{height:5px;background:var(--line2);border-radius:99px;margin-top:9px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--acc-bg);border-radius:99px;transition:width .3s ease}
.sitem{display:flex;align-items:flex-start;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.sitem:last-child{border-bottom:0}
.cbox{flex:none;width:22px;height:22px;border:1.5px solid var(--line);border-radius:8px;margin-top:2px;
  display:grid;place-items:center;color:transparent;transition:all .15s}
.sitem.done .cbox{background:var(--acc-bg);border-color:var(--acc-bg);color:var(--acc-ink)}
.sitem .sb{flex:1;min-width:0}
.sitem .snm2{font-size:14.5px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sitem.done .snm2{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--sub)}
.sitem .src{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.5}
.sitem .thumb{flex:none;width:40px;height:40px;border-radius:9px;background-size:cover;background-position:center;border:1px solid var(--line)}
.brand{display:inline-block;font:600 9.5px var(--mono);letter-spacing:.06em;color:var(--acc);
  border:1px solid var(--acc);border-radius:5px;padding:1px 5px;opacity:.85}
.xadd{display:flex;gap:7px;margin-top:14px}
.xadd input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;height:42px;padding:0 12px;outline:none;font-size:16px}
.xadd input:focus{border-color:var(--acc)}
.xadd input.amt{flex:0 0 88px}

/* ── 리스트 공용 카드 ── */
.paper{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh);padding:4px 14px}

/* ── 버튼 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:46px;padding:0 18px;
  border-radius:12px;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.btn.pri{background:var(--acc-bg);color:var(--acc-ink)}
.btn.pri:active{filter:brightness(1.08)}
.btn.gho{border:1.5px solid var(--line);color:var(--ink);background:var(--card)}
.btn.gho:active{background:var(--line2)}
.btn.blk{width:100%}
.btn.warn{color:var(--heart)}
.tbtns{display:flex;justify-content:center;gap:22px;margin-top:6px}
.tbtn{font-size:13px;font-weight:600;color:var(--sub);padding:8px 4px}
.tbtn.warn{color:var(--heart)}

/* ── 탭바 + FAB ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px) saturate(1.4);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;height:62px}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--sub);padding:6px 0}
.tb svg{width:22px;height:22px}
.tb span{font-size:9.5px;font-weight:700;letter-spacing:.02em}
.tb.act{color:var(--acc)}
.fabwrap{display:grid;place-items:center}
.fab{width:52px;height:52px;border-radius:17px;background:var(--acc-bg);color:var(--acc-ink);
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(30,60,40,.3);transform:translateY(-12px)}
.fab:active{transform:translateY(-12px) scale(.94)}
.fab svg{width:24px;height:24px}

/* ── 시트 ── */
.sw{position:fixed;inset:0;z-index:60}
.sw .sb{position:absolute;inset:0;background:rgba(16,22,16,.45);opacity:0;transition:opacity .24s}
.sw .sp{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--paper);
  border-radius:20px 20px 0 0;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  padding:8px 18px calc(26px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,.3,1)}
.sw.on .sb{opacity:1}
.sw.on .sp{transform:translateY(0)}
.sw.closing .sb{opacity:0}
.sw.closing .sp{transform:translateY(100%)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 14px}

/* ── 상세 ── */
.dhero{position:relative;margin:2px 0 16px}
.dhero .ph,.dhero .mono-ph{height:200px;border-radius:14px}
.dhero .mono-ph b{font-size:52px}
.dhero .no{position:absolute;top:10px;left:11px;font:600 10px var(--mono);letter-spacing:.14em;
  color:#fff;background:rgba(20,26,20,.45);padding:4px 8px;border-radius:6px;backdrop-filter:blur(4px)}
.dhero .mono-ph+.no{color:var(--acc);background:none;backdrop-filter:none}
.dtit{display:flex;flex-direction:column;gap:7px}
.dtit h3{font-size:23px;font-weight:900;letter-spacing:-.04em;line-height:1.3;text-wrap:balance}
.dmeta{font:600 11px var(--mono);color:var(--sub);letter-spacing:.05em}
.ing{display:flex;align-items:center;gap:10px;padding:10.5px 0;border-bottom:1px dashed var(--line2)}
.ing:last-child{border-bottom:0}
.ing .thumb{flex:none;width:34px;height:34px;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--line)}
.ing .leader{flex:1;display:flex;align-items:baseline;gap:8px;min-width:0}
.ing .inm{font-size:14px;font-weight:600;letter-spacing:-.02em;flex:none;max-width:60%}
.ing .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:16px}
.ing .amt{font:600 12px var(--mono);color:var(--sub);flex:none;font-variant-numeric:tabular-nums}
.steps{counter-reset:st;display:flex;flex-direction:column;gap:12px}
.steps li{list-style:none;display:flex;gap:12px;align-items:flex-start}
.steps li::before{counter-increment:st;content:counter(st,decimal-leading-zero);
  font:700 11px var(--mono);color:var(--acc);letter-spacing:.06em;padding-top:3px;flex:none}
.note{background:var(--soft);border-radius:11px;padding:12px 14px;font-size:13.5px;color:var(--ink);white-space:pre-line}
.dacts{display:flex;flex-direction:column;gap:8px;margin-top:20px}

/* ── 폼 ── */
.fld{margin-top:16px}
.fld>label{display:block;font:700 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--sub);margin-bottom:8px}
.in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;height:46px;
  padding:0 13px;outline:none;font-size:16px;transition:border-color .15s}
.in:focus{border-color:var(--acc)}
textarea.in{height:auto;min-height:58px;padding:11px 13px;resize:vertical;line-height:1.55}
.in::placeholder{color:var(--sub);opacity:.7}
#f-name{height:52px;font-size:17px;font-weight:700}
.fphoto{width:100%;height:120px;border:1.5px dashed var(--line);border-radius:13px;display:flex;
  align-items:center;justify-content:center;gap:8px;color:var(--sub);font-size:13px;font-weight:600;
  background-size:cover;background-position:center}
.fphoto.has{border-style:solid;color:transparent}
.irow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px;margin-bottom:8px}
.ir1{display:flex;gap:7px}
.ir1 .in{border:0;background:var(--line2);height:42px;font-size:16px}
.ir1 .i-n{flex:1;min-width:0}
.ir1 .i-a{flex:0 0 96px}
.ir2{display:flex;gap:7px;margin-top:7px;align-items:center}
.ir2 .i-b{flex:1;min-width:0;border:0;background:var(--line2);height:38px;font-size:16px}
.pbtn{flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);display:grid;
  place-items:center;color:var(--sub);background-size:cover;background-position:center}
.pbtn.has{color:transparent;border-color:var(--acc)}
.xbtn{flex:none;width:32px;height:36px;display:grid;place-items:center;color:var(--sub)}
.addrow{width:100%;border:1.5px dashed var(--line);border-radius:12px;height:44px;color:var(--sub);
  font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.srow{display:flex;gap:9px;align-items:flex-start;margin-bottom:8px}
.srow b{font:700 11px var(--mono);color:var(--acc);padding-top:13px;flex:none}
.srow textarea{flex:1}
.srow .xbtn{margin-top:3px}
.fcats{display:flex;gap:6px;flex-wrap:wrap}

/* ── 뽑기 · 사다리 ── */
.game{min-height:420px;display:flex;flex-direction:column}
.mchips{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.gacts{display:flex;gap:8px;margin-top:18px}
.gacts .btn{flex:1}
.lsvg{width:100%;height:auto;margin-top:4px}
.lsvg .rail{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.lsvg .rung{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.lsvg .trail{stroke:var(--acc);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lsvg .snode circle{fill:var(--card);stroke:var(--line);stroke-width:2}
.lsvg .snode text{fill:var(--ink);font:700 13px var(--mono)}
.lsvg .snode.hot circle{fill:var(--acc-bg);stroke:var(--acc-bg)}
.lsvg .snode.hot text{fill:var(--acc-ink)}
.lsvg .cand{fill:var(--sub);font:600 11px var(--kr)}
.lsvg .cand.win{fill:var(--acc);font-weight:800}
.ghint{text-align:center;color:var(--sub);font-size:12.5px;margin-top:10px}

/* ── 픽커 ── */
.prow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 2px;border-bottom:1px solid var(--line2)}
.prow .ph,.prow .mono-ph{width:44px;height:44px;flex:none}
.prow .mono-ph b{font-size:18px}
.prow .pb{flex:1;min-width:0}
.prow .pnm{font-size:14.5px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 메뉴 리스트 ── */
.lrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;box-shadow:var(--sh);padding:9px 10px;margin-bottom:9px}
.lmain{flex:1;min-width:0;display:flex;align-items:center;gap:11px;text-align:left}
.lmain .ph,.lmain .mono-ph{width:52px;height:52px;flex:none}
.lmain .mono-ph b{font-size:20px}
.lb{flex:1;min-width:0;display:block}
.lnm{display:block;font-size:15px;font-weight:800;letter-spacing:-.025em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmt{display:flex;align-items:center;gap:8px;margin-top:3px}
.ladd{flex:none;width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--acc);display:grid;place-items:center}
.ladd:active{filter:brightness(.95)}
.lmain .mono-ph i,.prow .mono-ph i,.vopt .mono-ph i{display:none}
.hero .acts .btn{flex:1;padding:0 8px}

/* ── 가족 투표 ── */
.vopt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:8px}
.vopt.on{border-color:var(--acc);background:var(--soft)}
.vopt .ph,.vopt .mono-ph{width:44px;height:44px;flex:none}
.vopt .mono-ph b{font-size:18px}
.vopt .vnm{flex:1;min-width:0;font-size:14.5px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vturn{text-align:center;padding:26px 0 12px}
.vturn .vt1{font:700 10px var(--mono);letter-spacing:.24em;color:var(--acc);text-transform:uppercase}
.vturn .vt2{font-size:26px;font-weight:900;letter-spacing:-.04em;margin-top:8px;text-wrap:balance}
.vturn .vt3{color:var(--sub);font-size:13px;margin-top:8px;line-height:1.6}
.vbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.vbar .vn{flex:none;width:88px;font-size:13px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.vbar .vtrack{flex:1;height:24px;background:var(--line2);border-radius:8px;overflow:hidden}
.vbar .vfill{display:block;height:100%;background:var(--acc-bg);border-radius:8px;min-width:3px;transition:width .5s ease}
.vbar.win .vfill{background:var(--heart)}
.vbar .vc{flex:none;font:700 13px var(--mono);width:18px;text-align:center;font-variant-numeric:tabular-nums}
.fam{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line2)}
.fam:last-child{border-bottom:0}
.fam b{flex:1;font-size:14.5px;font-weight:700}
#syncdot{width:9px;height:9px;border-radius:99px;background:var(--line);display:inline-block;margin-right:3px}
#syncdot.on{background:#43A968}
.obcode{font:800 30px var(--mono);letter-spacing:.3em;text-align:center;color:var(--acc);
  background:var(--soft);border-radius:14px;padding:18px 8px 18px calc(8px + .3em);margin:14px 0;user-select:all}

/* ── 토스트 ── */
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;letter-spacing:-.01em;
  padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:all .25s;z-index:90;
  max-width:86vw;text-align:center;box-shadow:var(--sh)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── 빈 상태 ── */
.empty{text-align:center;padding:44px 20px;color:var(--sub)}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.empty p{font-size:13px;line-height:1.6}

.mut{color:var(--sub);font-size:12px}
.hr{border:0;border-top:1px solid var(--line2);margin:18px 0}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

<script>
/* ═══════════ 유틸 ═══════════ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=> (crypto.randomUUID ? crypto.randomUUID() : 'id'+Math.random().toString(36).slice(2)+Date.now());
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>iso(new Date());
const fromISO=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const WD=['일','월','화','수','목','금','토'], WDE=['SUN','MON','TUE','WED','THU','FRI','SAT'];
function monday(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function weekOf(off){const m=monday(new Date());m.setDate(m.getDate()+off*7);return m}
function weekDays(mon){return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d})}
function relW(off){return off===0?'이번 주':off===1?'다음 주':off===-1?'지난 주':(off>0?off+'주 뒤':(-off)+'주 전')}
function mdot(s){const d=fromISO(s);return (d.getMonth()+1)+'.'+d.getDate()}
const MEALS=[['b','아침'],['l','점심'],['d','저녁']];
const MEAL={b:'아침',l:'점심',d:'저녁'};
const CATS=['밥','면','국·찌개','빵·브런치','반찬','간식','기타'];

const I={
 cam:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><circle cx="12" cy="13" r="4"/><path d="M8.5 7l1.4-2.3h4.2L15.5 7"/></svg>',
 x:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
 chk:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
 lt:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>',
 rt:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg>',
 heart:'<svg viewBox="0 0 24 24"><path d="M12 20.2s-7.1-4.6-9.1-9.1C1.5 8 3.7 4.6 6.9 4.6c2 0 3.5 1 5.1 3 1.6-2 3.1-3 5.1-3 3.2 0 5.4 3.4 4 6.5-2 4.5-9.1 9.1-9.1 9.1Z"/></svg>',
 srch:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',

 return `<div class="mono-ph ${cls||''}"><b>${esc((m.name||'?').slice(0,1))}</b>${m.no?`<i>No.${pad(m.no)}</i>`:''}</div>`}

/* 저장: IndexedDB 우선, 실패 시 localStorage */
let idbOK=true;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('ourtable',1);
 r.onupgradeneeded=()=>r.result.createObjectStore('kv');
 r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error)})}
async function dbSet(v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');
 t.objectStore('kv').put(v,'S'); t.oncomplete=res; t.onerror=()=>rej(t.error)})}
async function dbGet(){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readonly');
 const q=t.objectStore('kv').get('S'); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error)})}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(flush,250)}
async function flush(){ try{ if(idbOK){await dbSet(S);return} }catch(e){idbOK=false}
 try{localStorage.setItem('ourtable',JSON.stringify(S))}catch(e){} }
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

function menu(id){return S.menus.find(m=>m.id===id)}
function slotName(v){return v==='DELIV'?'배달 찬스':(v&&menu(v)?menu(v).name:null)}
function setPlan(date,meal,val){const p=(S.plan[date]=S.plan[date]||{});
 if(val==null)delete p[meal];else p[meal]=val;
 save(); if(typeof syncOn!=='undefined'&&syncOn)pushPlan(date,meal,val)}
function ingNames(){const s=new Set();S.menus.forEach(m=>(m.ingredients||[]).forEach(g=>{if(g.name)s.add(g.name)}));return[...s]}
function brandNames(){const s=new Set();S.menus.forEach(m=>(m.ingredients||[]).forEach(g=>{if(g.brand)s.add(g.brand)}));return[...s]}
function bestSorted(){return [...S.menus].sort((a,b)=>(b.rating-a.rating)||(b.cookCount-a.cookCount)||b.createdAt.localeCompare(a.createdAt))}

/* ═══════════ 렌더 ═══════════ */
function go(t){ if(t==='shop'&&!ui.shopInit){ui.shopInit=true;
  const has=w=>weekDays(weekOf(w)).some(d=>{const p=S.plan[iso(d)];return p&&(p.b||p.l||p.d)});
  ui.shopWeek = has(0)?0 : (has(1)?1:0); }
 ui.tab=t; render() }

function render(){
 $$('.tb').forEach(b=>b.classList.toggle('act',b.dataset.t===ui.tab));
 $('#scr').innerHTML=({home:vHome,menus:vMenus,plan:vPlan,shop:vShop})[ui.tab]();
 if(ui._last!==ui.tab){window.scrollTo(0,0);ui._last=ui.tab}
}

/* ── 홈 ── */
function vHome(){
 const t=new Date(), ti=todayISO();
 const dateLn=`${t.getMonth()+1}.${t.getDate()} ${WDE[t.getDay()]} — TONIGHT`;
 const tp=S.plan[ti]||{}; let td=null;
 for(const mk of ['d','l','b']) if(tp[mk]){td={meal:mk,val:tp[mk],delivery:tp[mk]==='DELIV'};break}
 if(td&&!td.delivery&&!menu(td.val)) td=null;
 const pick=td?(td.delivery?{name:'배달 찬스',no:0,photo:''}:menu(td.val)):null;
 let hero;
 if(pick){
  hero=`<section class="hero"><div class="date">${dateLn}</div>
   <div class="hero-menu">${phEl(pick)}
    <div><div class="eyebrow">오늘의 ${MEAL[td.meal]||'저녁'}</div>
     <div class="nm">${esc(pick.name)}</div>
     <div class="mt">${td.delivery?'오늘은 요리 쉬는 날':`No.${pad(pick.no)} · ${pick.cookCount}번 해먹음`}</div></div></div>
   <div class="acts">${td.delivery?'':`<button class="btn pri" data-a="cook" data-id="${pick.id}">오늘 해먹었어요</button>`}
    <button class="btn gho" data-a="retoday">다시 정하기</button></div></section>`;
 }else{
  hero=`<section class="hero"><div class="date">${dateLn}</div>
   <h1>오늘 뭐,<br>먹지?</h1>
   <div class="sub">우리집 메뉴판 ${S.menus.length}가지 중에서 골라줄게요.</div>
   <div class="acts"><button class="btn pri" data-a="openLadder">사다리 타기</button>
    <button class="btn gho" data-a="openVote">가족 투표</button></div></section>`;
 }
 const days=weekDays(weekOf(0)).map(d=>{const k=iso(d);const nm=slotName((S.plan[k]||{}).d);
  return `<button class="dcol ${k===ti?'today':''}" data-a="go" data-t="plan">
   <span class="dl">${WDE[d.getDay()][0]}</span>
   <span class="dn ${nm?'':'none'}">${nm?esc(nm):'·'}</span></button>`}).join('');
 return hero+
  `<section class="sec"><div class="sec-h"><div><div class="eyebrow">This Week</div><h2>이번 주 저녁</h2></div></div>
    <div class="strip">${days}</div></section>`;
}

/* ── 메뉴판 ── */
function vMenus(){
 let list=bestSorted();
 if(ui.sort==='new')list=[...S.menus].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
 if(ui.sort==='often')list=[...S.menus].sort((a,b)=>(b.cookCount-a.cookCount)||(b.rating-a.rating));
 if(ui.cat)list=list.filter(m=>m.cat===ui.cat);
 if(ui.q)list=list.filter(m=>m.name.toLowerCase().includes(ui.q.toLowerCase()));
 const top3=bestSorted().slice(0,3);
 const rail=(S.menus.length&&!ui.q&&!ui.cat)?`<div class="eyebrow" style="margin-bottom:9px">Best of Home</div>
  <div class="rail" style="margin-bottom:14px">${top3.map((m,i)=>`<button class="rcard" data-a="detail" data-id="${m.id}">

   <div class="b"><div class="nm">${esc(m.name)}</div>
   <div style="margin-top:5px">${hearts(m.rating)}</div></div></button>`).join('')}</div>`:'';
 const rows=list.map(m=>`<div class="lrow">
   <button class="lmain" data-a="detail" data-id="${m.id}">${phEl(m)}

     <span class="lmt">${hearts(m.rating)}<span class="cooked">×${m.cookCount}</span><span class="cooked">No.${pad(m.no)}</span></span></span></button>
   <button class="ladd" data-a="toPlan" data-id="${m.id}" aria-label="식단표에 넣기">${I.plus}</button></div>`).join('');
 const sorts=[['best','베스트순'],['new','최근 등록'],['often','자주 해먹은']];
 return `<section class="sec"><div class="sec-h"><div><div class="eyebrow">House Menu</div><h2>우리집 메뉴판</h2></div>
   <span class="cnt">${list.length} / ${S.menus.length}</span></div>
  ${rail}
  <div class="tools">
   <div class="search">${I.srch}<input id="q" placeholder="SEARCH" value="${esc(ui.q)}" autocomplete="off"></div>
   <div class="chips">${sorts.map(([k,v])=>`<button class="chip ${ui.sort===k?'on':''}" data-a="sort" data-s="${k}">${v}</button>`).join('')}</div>
   <div class="chips"><button class="chip ${ui.cat===''?'on':''}" data-a="cat" data-c="">전체</button>
    ${CATS.map(c=>`<button class="chip ${ui.cat===c?'on':''}" data-a="cat" data-c="${c}">${c}</button>`).join('')}</div>
  </div>
  ${rows||`<div class="empty"><b>아직 여기엔 없어요</b><p>아래 + 버튼으로 첫 메뉴를 올려보세요.<br>이름만 적어도 충분해요.</p></div>`}
 </section>`;
}

/* ── 식단표 ── */
function wknav(off,act){const mon=weekOf(off),sun=new Date(mon);sun.setDate(sun.getDate()+6);
 return `<div class="wknav"><button class="icobtn" data-a="${act}" data-d="-1" aria-label="이전 주">${I.lt}</button>

  <button class="icobtn" data-a="${act}" data-d="1" aria-label="다음 주">${I.rt}</button></div>`}

  const ms=MEALS.filter(([mk])=>S.allMeals||mk==='d'||p[mk]);
  const slots=ms.map(([mk,ml])=>{const nm=slotName(p[mk]);
   return nm?`<button class="slot fill" data-a="slot" data-date="${k}" data-m="${mk}">
     <span class="ml">${ml}</span><span class="snm">${esc(nm)}</span>
     <span class="sx" data-a="slotX" data-date="${k}" data-m="${mk}" role="button" aria-label="비우기">${I.x}</span></button>`

/* ── 장보기 ── */
function shopData(){
 const wk=iso(weekOf(ui.shopWeek)); const map=new Map();
 weekDays(weekOf(ui.shopWeek)).forEach(d=>{const p=S.plan[iso(d)]||{};
  MEALS.forEach(([mk])=>{const m=p[mk]?menu(p[mk]):null; if(!m)return;
   (m.ingredients||[]).forEach(g=>{const key=g.name.trim(); if(!key)return;
    const e=map.get(key)||{name:key,brand:'',photo:'',uses:[]};
    if(!e.brand&&g.brand)e.brand=g.brand; if(!e.photo&&g.photo)e.photo=g.photo;
    if(!e.uses.some(u=>u.m===m.name&&u.a===g.amount))e.uses.push({m:m.name,a:g.amount});
    map.set(key,e)})})});
 const extras=(S.extra[wk]||[]);
 return {wk,items:[...map.values()],extras};
}
function vShop(){
 const {wk,items,extras}=shopData();
 const ck=k=>!!S.checked[wk+'|'+k];
 const total=items.length+extras.length;
 const done=items.filter(i=>ck(i.name)).length+extras.filter(x=>ck('x'+x.id)).length;
 const rows=items.map(it=>{const c=ck(it.name);
  return `<button class="sitem ${c?'done':''}" data-a="chk" data-k="${esc(it.name)}">
   <span class="cbox">${I.chk}</span>
   <span class="sb"><span class="snm2">${esc(it.name)}${it.brand?`<span class="brand">${esc(it.brand)}</span>`:''}</span>
    <span class="src">${it.uses.map(u=>`${esc(u.a||'적당량')} · ${esc(u.m)}`).join('<br>')}</span></span>
   ${it.photo?`<span class="thumb" style="background-image:url(${it.photo})"></span>`:''}</button>`}).join('');
 const xrows=extras.map(x=>{const c=ck('x'+x.id);
  return `<button class="sitem ${c?'done':''}" data-a="chk" data-k="x${x.id}">
   <span class="cbox">${I.chk}</span>
   <span class="sb"><span class="snm2">${esc(x.name)}</span>${x.amount?`<span class="src">${esc(x.amount)}</span>`:''}</span>
   <span class="sx" data-a="xdel" data-id="${x.id}" role="button" aria-label="삭제" style="color:var(--sub);width:26px;height:26px;display:grid;place-items:center">${I.x}</span></button>`}).join('');
 const body = total?`<div class="prog"><div class="pt"><b>${done===total?'장보기 완료!':'장바구니'}</b>
    <span id="pgt">${done} / ${total}</span></div><div class="pbar"><i id="pgb" style="width:${total?Math.round(done/total*100):0}%"></i></div></div>
   <div class="paper">${rows}${xrows}</div>`
  :`<div class="empty"><b>이번 주 장 볼 게 아직 없어요</b><p>식단표에 메뉴를 채우면<br>필요한 재료가 여기 자동으로 모여요.</p>
    <button class="btn gho" style="margin-top:14px" data-a="go" data-t="plan">식단표 채우러 가기</button></div>`;
 return `<section class="sec"><div class="sec-h"><div><div class="eyebrow">Grocery List</div><h2>장보기 리스트</h2></div></div>
  ${wknav(ui.shopWeek,'swk')}${body}
  <div class="xadd"><input id="xn" list="dlIngS" placeholder="직접 추가 · 예) 화덕브레드" autocomplete="off"><input id="xa" class="amt" placeholder="양" autocomplete="off">
   <button class="btn pri" style="height:42px;padding:0 14px" data-a="xadd">추가</button></div>
  <datalist id="dlIngS">${ingNames().map(n=>`<option value="${esc(n)}">`).join('')}</datalist></section>`;
}

let SHEETS=[],seq=0;
function sheet(html){const id='sh'+(++seq);const w=document.createElement('div');w.className='sw';w.id=id;
 w.innerHTML=`<div class="sb" data-a="shClose"></div><div class="sp"><div class="grab"></div>${html}</div>`;
 document.body.appendChild(w);requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('on')));
 SHEETS.push(id);document.body.classList.add('lock');
 history.pushState({sheet:SHEETS.length},'');return id}
function shClose(){const id=SHEETS.pop();const w=id&&document.getElementById(id);if(!w)return;
 w.classList.remove('on');w.classList.add('closing');setTimeout(()=>w.remove(),280);
 if(!SHEETS.length)document.body.classList.remove('lock')}
function shCloseAll(){while(SHEETS.length)shClose()}
/* 모바일 뒤로가기 = 시트 닫기 */
window.addEventListener('popstate',e=>{const d=(e.state&&e.state.sheet)||0;
 while(SHEETS.length>d)shClose()});

async function exportJson(){
 const data=JSON.stringify(S,null,2), fn=`ourtable-backup-${todayISO()}.json`;
 if(window.claude&&window.claude.downloads){
  try{await window.claude.downloads.save({filename:fn,data});toast('백업 파일을 저장했어요')}
  catch(e){if(e&&e.code==='declined')return; if(e&&e.code==='rate_limited'){toast('잠시 뒤 다시 눌러주세요')}else fallbackDl(fn,data)}
 }else fallbackDl(fn,data);
}
function fallbackDl(fn,data){try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'}));
 const a=document.createElement('a');a.href=u;a.download=fn;a.click();setTimeout(()=>URL.revokeObjectURL(u),4000);
 toast('백업 파일을 내려받았어요')}catch(e){toast('저장이 막혀 있어요')}}
function importJson(f){if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const o=JSON.parse(rd.result);
   if(!o||!Array.isArray(o.menus))throw 0;
   S=Object.assign(seed(),o);
   S.seq=Math.max(S.seq||2,S.menus.length+1,...S.menus.map(m=>(m.no||0)+1));
   save(); shCloseAll(); render(); toast('불러왔어요 — 그대로 이어서 쓰면 돼요')}
  catch(e){toast('이 파일은 우리집 식탁 백업이 아니에요')}};
 rd.readAsText(f)}

function gameHead(t,e){return `<div class="sec-h" style="margin-top:4px"><div><div class="eyebrow">${e}</div><h2>${t}</h2></div></div>
 <div class="mchips">${MEALS.map(([k,v])=>`<button class="chip ${G.meal===k?'on':''}" data-a="gmeal" data-m="${k}">${v}</button>`).join('')}</div>`}

function openLadder(){ if(S.menus.length<2){toast('메뉴가 2가지는 있어야 사다리를 타요');return}
 G={meal:'d',mode:'ladder'};
 const pool=[...S.menus].sort(()=>Math.random()-.5);
 G.cands=pool.slice(0,Math.min(4,pool.length));
 const K=G.cands.length,W=320;
 G.xs=Array.from({length:K},(_,i)=>Math.round(K===2?100+i*120:32+i*((W-64)/(K-1))));
 const top=58,bot=292,L=7;
 G.ys=Array.from({length:L},(_,i)=>Math.round(top+(i+1)*(bot-top)/(L+1)));
 G.top=top;G.bot=bot;
 G.rungs=[];
 G.ys.forEach(y=>{const cols=[...Array(K-1).keys()].sort(()=>Math.random()-.5);const placed=[];
  cols.forEach(c=>{if(Math.random()<.58&&!placed.some(p=>Math.abs(p-c)<=1)){placed.push(c);G.rungs.push({y,c})}});
  if(!placed.length&&Math.random()<.7){const c=Math.floor(Math.random()*(K-1));G.rungs.push({y,c})}});
 const rails=G.xs.map(x=>`<line class="rail" x1="${x}" y1="${top}" x2="${x}" y2="${bot}"/>`).join('');

 let m=h.match(/vote=([\w-]+)/);if(m)pendingHash={vote:m[1]};
 m=h.match(/join=([A-Za-z0-9]+)/);if(m)pendingHash=Object.assign(pendingHash||{},{join:m[1]});
 history.replaceState(history.state,'',location.pathname+location.search)}

 HOME=ME.home_id;syncOn=true;updateSyncBadge();

 await flushDirty();await pullAll();subscribeRT();

/* ── 당겨오기 · 실시간 ── */
let pullT=null;
function pullSoon(){clearTimeout(pullT);pullT=setTimeout(()=>pullAll(),400)}
async function pullAll(){try{
 const [me,pl,ex,ck,mb]=await Promise.all([
  sb.from('menus').select('*').eq('deleted',false).order('no'),
  sb.from('plans').select('*'),
  sb.from('shopping_extras').select('*'),
  sb.from('shopping_checked').select('*'),
  sb.from('members').select('*')]);
 if(me.error)throw me.error;
 S.menus=(me.data||[]).map(r=>({id:r.id,no:r.no,name:r.name,cat:r.cat||'',rating:r.rating||0,
  cookCount:r.cook_count||0,lastCookedAt:r.last_cooked_at||'',photo:r.photo_url||'',memo:r.memo||'',
  ingredients:r.ingredients||[],steps:r.steps||[],createdAt:r.created_at,updatedAt:r.updated_at}));
 S.seq=Math.max(2,...S.menus.map(m=>(m.no||0)+1),S.menus.length+1);
 S.plan={};(pl.data||[]).forEach(r=>{(S.plan[r.date]=S.plan[r.date]||{})[r.meal]=r.delivery?'DELIV':r.menu_id});
 S.extra={};(ex.data||[]).forEach(r=>{(S.extra[r.week]=S.extra[r.week]||[]).push({id:r.id,name:r.name,amount:r.amount||''})});
 S.checked={};(ck.data||[]).forEach(r=>{if(r.checked)S.checked[r.week+'|'+r.item_key]=true});
 if(mb.data)MEMBERS=mb.data;
 save();render()}catch(e){}}
let RTCH=null;
function subscribeRT(){if(RTCH||!sb)return;
 RTCH=sb.channel('home-sync');
 ['menus','plans','shopping_extras','shopping_checked','votes','ballots'].forEach(t=>{
  RTCH.on('postgres_changes',{event:'*',schema:'public',table:t},()=>{
   if(t==='ballots'||t==='votes')refreshVoteLive();
   pullSoon()})});
 RTCH.subscribe()}
window.addEventListener('online',()=>{if(syncOn)flushDirty()});

/* ── 올리기 ── */
function dirty(t,k){((S._dirty=S._dirty||{})[t]=S._dirty[t]||{})[k]=true;save();
 toast('저장은 됐어요 — 인터넷 연결되면 가족에게도 반영돼요')}
async function flushDirty(){const D=S._dirty||{};
 for(const id of Object.keys(D.menus||{})){const m=menu(id);
  if(m)await pushMenu(m,true);else await pushMenuDelete(id,true)}
 for(const k of Object.keys(D.plans||{})){const i=k.indexOf('|');
  await pushPlan(k.slice(0,i),k.slice(i+1),(S.plan[k.slice(0,i)]||{})[k.slice(i+1)]??null,true)}
 S._dirty={};save()}
async function maybeUpload(p){if(!p||!p.startsWith('data:'))return p||'';
 const blob=await (await fetch(p)).blob();
 const path=HOME+'/'+uid()+'.jpg';
 const {error}=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'});
 if(error)throw error;
 return sb.storage.from('photos').getPublicUrl(path).data.publicUrl}
async function pushMenu(m,noDirty){try{
 m.photo=await maybeUpload(m.photo);
 for(const g of m.ingredients||[])g.photo=await maybeUpload(g.photo);
 save();
 const {error}=await sb.from('menus').upsert({id:m.id,home_id:HOME,no:m.no||0,name:m.name,
  cat:m.cat||'',rating:m.rating||0,cook_count:m.cookCount||0,last_cooked_at:m.lastCookedAt||null,
  photo_url:m.photo||'',memo:m.memo||'',ingredients:m.ingredients||[],steps:m.steps||[],
  deleted:false,updated_at:new Date().toISOString()});
 if(error)throw error}catch(e){if(!noDirty)dirty('menus',m.id)}}
async function pushMenuDelete(id,noDirty){try{
 const {error}=await sb.from('menus').update({deleted:true,updated_at:new Date().toISOString()}).eq('id',id);
 if(error)throw error}catch(e){if(!noDirty)dirty('menus',id)}}
async function pushPlan(date,meal,val,noDirty){try{
 if(val==null){const {error}=await sb.from('plans').delete().match({home_id:HOME,date,meal});if(error)throw error}
 else{const {error}=await sb.from('plans').upsert({home_id:HOME,date,meal,
  menu_id:val==='DELIV'?null:val,delivery:val==='DELIV',updated_at:new Date().toISOString()});if(error)throw error}
}catch(e){if(!noDirty)dirty('plans',date+'|'+meal)}}
async function pushExtra(wk,x,del){try{
 if(del)await sb.from('shopping_extras').delete().eq('id',x.id);
 else await sb.from('shopping_extras').insert({id:x.id,home_id:HOME,week:wk,name:x.name,amount:x.amount||''});
}catch(e){}}
async function pushChecked(wk,key,on){try{
 if(on)await sb.from('shopping_checked').upsert({home_id:HOME,week:wk,item_key:key,checked:true,updated_at:new Date().toISOString()});
 else await sb.from('shopping_checked').delete().match({home_id:HOME,week:wk,item_key:key});
}catch(e){}}
async function pushLocalAll(){toast('우리집 계정에 올리는 중…');
 for(const m of S.menus)await pushMenu(m);
 for(const [dt,p] of Object.entries(S.plan||{}))for(const [ml,v] of Object.entries(p))if(v)await pushPlan(dt,ml,v);
 for(const [wk,xs] of Object.entries(S.extra||{}))for(const x of xs)await pushExtra(wk,x,false);
 for(const key of Object.keys(S.checked||{})){const i=key.indexOf('|');
  await pushChecked(key.slice(0,i),key.slice(i+1),true)}
 await pullAll();toast('다 올렸어요! 이제 가족과 같이 써요')}

async function refreshVoteLive(){

 const v=LIVE.vote,ballots=bs||[],closed=v.status==='closed';
 const my=ballots.find(b=>b.member_id===(ME&&ME.id));
 const cnt={};(v.candidates||[]).forEach(k=>cnt[k]=0);ballots.forEach(b=>{if(cnt[b.choice]!=null)cnt[b.choice]++});
 const nm=k=>k==='DELIV'?'배달 찬스':(menu(k)?menu(k).name:'?');
 const bars=[...(v.candidates||[])].sort((a,b)=>cnt[b]-cnt[a]).map(k=>`<div class="vbar">
  <span class="vn">${esc(nm(k))}</span><span class="vtrack"><span class="vfill" style="width:${Math.round(cnt[k]/Math.max(1,MEMBERS.length)*100)}%"></span></span>
  <span class="vc">${cnt[k]}</span></div>`).join('');
 const opts=closed?'':(v.candidates||[]).map(k=>`<button class="vopt ${my&&my.choice===k?'on':''}" data-a="vlCast" data-k="${k}">
  ${phEl(k==='DELIV'?DELIV:(menu(k)||{name:'?',no:0,photo:''}))}<span class="vnm">${esc(nm(k))}</span>${my&&my.choice===k?'<span class="cooked">내 표</span>':''}</button>`).join('');
 const el=$('#vlive');if(!el)return;
 el.innerHTML=`<div class="vturn" style="padding:8px 0 8px"><div class="vt1">${closed?'Result':'Family Vote'}</div>
  <div class="vt2">오늘 ${MEAL[v.meal]}, 뭐 먹을까?</div>
  <div class="vt3">${ballots.length} / ${MEMBERS.length}명 투표${closed?' · 마감됨':' · 실시간 개표 중'}</div></div>
  ${bars}
  ${opts?`<div style="margin-top:14px">${opts}</div>`:''}
  <div class="dacts">
   ${!closed?`<button class="btn gho blk" data-a="vlShare">가족에게 투표 링크 보내기</button>`:''}
   ${!closed&&ballots.length?`<button class="btn pri blk" data-a="vlFinish">마감하고 오늘 식단에 반영</button>`:''}
  </div>`}
async function vlCast(k){try{
 const {error}=await sb.from('ballots').upsert({vote_id:LIVE.id,member_id:ME.id,choice:k});
 if(error)throw error;refreshVoteLive()}
 catch(e){toast('투표가 안 들어갔어요 — 인터넷 확인')}}
async function vlFinish(){try{
 const {data:bs}=await sb.from('ballots').select('*').eq('vote_id',LIVE.id);
 const v=LIVE.vote,cnt={};(v.candidates||[]).forEach(k=>cnt[k]=0);
 (bs||[]).forEach(b=>{if(cnt[b.choice]!=null)cnt[b.choice]++});
 const mx=Math.max(...Object.values(cnt));
 const ws=v.candidates.filter(k=>cnt[k]===mx);
 const win=ws[Math.floor(Math.random()*ws.length)];
 await sb.from('votes').update({status:'closed'}).eq('id',LIVE.id);
 setPlan(v.date,v.meal,win==='DELIV'?'DELIV':win);
 LIVE=null;shCloseAll();go('home');
 toast(win==='DELIV'?`오늘 ${MEAL[v.meal]}은 배달 찬스!`:`오늘 ${MEAL[v.meal]}은 ${menu(win)?menu(win).name:'결정'}!`)}
 catch(e){toast('마감하지 못했어요')}}
function vlShare(){if(!LIVE)return;
 shareText(`오늘 ${MEAL[LIVE.vote.meal]} 뭐 먹을지 투표해줘!`,OT_CONFIG.page+'#vote='+LIVE.id)}

/* ═══════════ 사진 ═══════════ */
function grabPhoto(cb){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
 inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const img=new Image();
   img.onerror=()=>toast('사진을 읽지 못했어요 — 다른 사진으로 해주세요');
   img.onload=()=>{const mx=900,sc=Math.min(1,mx/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    cb(cv.toDataURL('image/jpeg',.82))};
   img.src=rd.result};
  rd.readAsDataURL(f)};
 inp.click()}

/* ═══════════ 액션 ═══════════ */
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');
 clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2300)}

const ACT={
 go:d=>go(d.t),
 settings:openSettings, shClose:shClose,
 newMenu:()=>{ui.pendingSlot=null;openForm()},
 detail:d=>openDetail(d.id),
 sort:d=>{ui.sort=d.s;render()},
 cat:d=>{ui.cat=d.c;render()},
 wk:d=>{ui.week=d.d==='0'?0:ui.week+Number(d.d);render()},
 swk:d=>{ui.shopWeek=d.d==='0'?0:ui.shopWeek+Number(d.d);render()},
 slot:d=>{const v=(S.plan[d.date]||{})[d.m];
  if(v&&v!=='DELIV'&&menu(v))openDetail(v);else openPicker(d.date,d.m)},
 slotX:d=>{setPlan(d.date,d.m,null);render()},
 pick:d=>{const ps=ui.pendingSlot;if(!ps)return;ui.pendingSlot=null;
  setPlan(ps.date,ps.m,d.id);
  shClose();render();toast(`${mdot(ps.date)} ${MEAL[ps.m]} — ${menu(d.id).name}`)},
 pickNew:()=>openForm(),
 slotPut:d=>{setPlan(d.date,d.m,d.id);
  shClose();render();toast(`${mdot(d.date)} ${MEAL[d.m]}에 넣었어요`)},
 toPlan:d=>openChooser(d.id),
 cook:d=>{const m=menu(d.id);if(!m)return;
  if(m.lastCookedAt===todayISO()){toast('오늘은 이미 기록했어요');return}
  m.cookCount++;m.lastCookedAt=todayISO();m.updatedAt=new Date().toISOString();save();if(syncOn)pushMenu(m);render();
  toast(`${m.cookCount}번째 기록! 맛있게 드세요`)},
 rate:(d,el)=>{const wrap=el.closest('.hearts');const id=wrap&&wrap.dataset.id;const m=id&&menu(id);if(!m)return;
  m.rating=Number(d.v);m.updatedAt=new Date().toISOString();save();if(syncOn)pushMenu(m);
  wrap.querySelectorAll('svg').forEach((s,i)=>s.classList.toggle('on',i<m.rating));render()},
 edit:d=>openForm(d.id),
 delMenu:d=>{const m=menu(d.id);openConfirm(`‘${esc(m.name)}’ 를 메뉴판에서 뺄까요?`,'네, 뺄게요',()=>{
   S.menus=S.menus.filter(x=>x.id!==d.id);
   Object.entries(S.plan).forEach(([dt,p])=>MEALS.forEach(([k])=>{if(p[k]===d.id)setPlan(dt,k,null)}));
   save();if(typeof syncOn!=='undefined'&&syncOn)pushMenuDelete(d.id);
   shCloseAll();render();toast('뺐어요')})},
 confYes:()=>{const f=CONF;CONF=null;shClose();f&&f()},
 chk:d=>{const wk=iso(weekOf(ui.shopWeek));const key=wk+'|'+d.k;
  S.checked[key]=!S.checked[key];if(!S.checked[key])delete S.checked[key];save();
  if(syncOn)pushChecked(wk,d.k,!!S.checked[key]);render()},
 xadd:()=>{const n=$('#xn').value.trim();if(!n){$('#xn').focus();return}
  const wk=iso(weekOf(ui.shopWeek));const x={id:uid(),name:n,amount:$('#xa').value.trim()};
  (S.extra[wk]=S.extra[wk]||[]).push(x);
  save();if(typeof syncOn!=='undefined'&&syncOn)pushExtra(wk,x,false);render();toast('추가했어요')},
 xdel:(d)=>{const wk=iso(weekOf(ui.shopWeek));S.extra[wk]=(S.extra[wk]||[]).filter(x=>x.id!==d.id);
  delete S.checked[wk+'|x'+d.id];save();
  if(syncOn){pushExtra(wk,{id:d.id},true);pushChecked(wk,'x'+d.id,false)}render()},
 fphoto:()=>grabPhoto(u=>{F.photo=u;const b=$('#f-photo');b.classList.add('has');b.style.backgroundImage=`url(${u})`}),
 frate:(d,el)=>{F.rating=Number(d.v);
  $('#f-hearts').querySelectorAll('svg').forEach((s,i)=>s.classList.toggle('on',i<F.rating))},
 fcat:(d,el)=>{F.cat=(F.cat===d.c)?'':d.c;
  $$('.fcats .chip').forEach(c=>c.classList.toggle('on',c.dataset.c===F.cat))},
 ingAdd:()=>$('#ingRows').insertAdjacentHTML('beforeend',ingRowHTML()),
 stepAdd:()=>{$('#stepRows').insertAdjacentHTML('beforeend',stepRowHTML());renum()},
 rowDel:(d,el)=>{const r=el.closest('.irow,.srow');r&&r.remove();renum()},
 ingPhoto:(d,el)=>{const row=el.closest('.irow');grabPhoto(u=>{row.dataset.photo=u;
  el.classList.add('has');el.style.backgroundImage=`url(${u})`})},
 saveMenu:saveMenu,
 exp:exportJson,
 impBtn:()=>$('#impF').click(),
 wipe:()=>openConfirm('정말 전부 지울까요? 되돌릴 수 없어요.','네, 처음부터 할게요',()=>{
  S=seed();save();shCloseAll();ui={...ui,week:0,shopWeek:0,shopInit:false,cat:'',q:''};render();toast('새 보관함을 꺼냈어요')}),
 openLadder:openLadder,
 retoday:()=>{const ti=todayISO(),p=S.plan[ti]||{};
  for(const mk of ['d','l','b'])if(p[mk]){setPlan(ti,mk,null);break}
  render()},
 mealsToggle:()=>{S.allMeals=!S.allMeals;save();render()},
 gmeal:(d)=>{G.meal=d.m;$$('.mchips .chip').forEach(c=>c.classList.toggle('on',c.dataset.m===d.m))},
 ladderAgain:()=>{shClose();openLadder()},
 lgo:d=>ladderGo(Number(d.i)),
 decide:d=>decide(d.id),
 openVote:openVote,
 vsel:(d,el)=>{if(V.sel.has(d.id)){V.sel.delete(d.id);el.classList.remove('on')}
  else if(V.sel.size>=4){toast('후보는 4개까지만!')}else{V.sel.add(d.id);el.classList.add('on')}},
 vdeliv:(d,el)=>{V.deliv=!V.deliv;el.classList.toggle('on',V.deliv)},
 vmeal:(d,el)=>{V.meal=d.m;el.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.m===d.m))},
 vstart:()=>{if(S.family.length<2){openFamily(true);return}
  V.cands=[...V.sel,...(V.deliv?['DELIV']:[])];
  if(V.cands.length<2){toast('후보를 2개 이상 골라주세요');return}V.votes=[];V.turn=0;vTurn()},
 vballot:vBallot,
 vcast:d=>{V.votes.push(d.k);V.turn++;V.turn<S.family.length?vTurn():vResult()},
 vtie:()=>{const{winners}=tallyV();vResult(winners[Math.floor(Math.random()*winners.length)])},
 vre:()=>{shClose();openVote()},
 vdecide:d=>vDecide(d.k),
 fam:()=>openFamily(false),
 famAdd:()=>{const i=$('#famN'),n=i.value.trim();if(!n){i.focus();return}
  S.family.push({id:uid().slice(0,8),name:n});save();
  $('#famList').innerHTML=famRows();const c=$('#famCnt');if(c)c.textContent=S.family.length+'명';i.value='';i.focus()},
 famDel:d=>{S.family=S.family.filter(f=>f.id!==d.id);save();
  $('#famList').innerHTML=famRows();const c=$('#famCnt');if(c)c.textContent=S.family.length+'명'},
 famDone:()=>{if(S.family.length<2){toast('2명은 있어야 투표할 수 있어요');return}shClose();openVote()},
 ob:()=>openOnboard(),
 obCreate:obCreate, obJoin:obJoin,
 obSkip:()=>{sessionStorage.setItem('obSkip','1');shClose()},
 obDone:()=>{shCloseAll();connectAsMember(false)},
 shareInvite:shareInvite,
 vstartRemote:vstartRemote,
 vlCast:d=>vlCast(d.k),
 vlFinish:vlFinish,
 vlShare:vlShare
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;
 const a=ACT[el.dataset.a];if(a){e.preventDefault();a(el.dataset,el,e)}});
document.addEventListener('input',e=>{
 if(e.target.id==='q'){ui.q=e.target.value;
  clearTimeout(ui._qt);ui._qt=setTimeout(()=>{const v=$('#q');const pos=v.selectionStart;render();
   const n=$('#q');if(n){n.focus();n.setSelectionRange(pos,pos)}},350)}});
document.addEventListener('change',e=>{if(e.target.id==='impF')importJson(e.target.files[0]);
 if(e.target.classList&&e.target.classList.contains('i-n')){   // 재료명 고르면 브랜드 자동 채움
  const row=e.target.closest('.irow'),b=row&&row.querySelector('.i-b');
  if(b&&!b.value){const n=e.target.value.trim();
   outer:for(const m of S.menus)for(const g of m.ingredients||[])
    if(g.name===n&&g.brand){b.value=g.brand;break outer}}}});

(async function init(){
 try{S=await dbGet()}catch(e){idbOK=false}
 if(!S){try{const ls=localStorage.getItem('ourtable');if(ls)S=JSON.parse(ls)}catch(e){}}
 if(!S){S=seed();flush()}
 if(!S.extra)S.extra={}; if(!S.checked)S.checked={}; if(!S.seq)S.seq=S.menus.length+1; if(!S.family)S.family=[];
 render();
 syncInit();
})();
